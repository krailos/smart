spring:
  datasource:
    # Створюємо базу в пам'яті під назвою testdb
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # Hibernate сам створить усі таблиці на основі @Entity класів
    hibernate:
      ddl-auto: create-drop
    # Показувати SQL-запити в консолі для зручності відлагодження
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Вмикаємо виконання файлу data.sql ПІСЛЯ того, як Hibernate створить схему
    defer-datasource-initialization: true