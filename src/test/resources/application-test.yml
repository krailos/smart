spring:
  datasource:
    # Створюємо базу в пам'яті під назвою testdb
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # Hibernate сам створить усі таблиці на основі @Entity класів
    hibernate:
      ddl-auto: create-drop
    # Показувати SQL-запити в консолі для зручності відлагодження
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Вмикаємо виконання файлу data_v1.sql ПІСЛЯ того, як Hibernate створить схему
    defer-datasource-initialization: true

  # Схему тестової бази будує ТІЛЬКИ Hibernate (з @Entity, рядок ddl-auto вище).
  # З увімкненим Flyway її будували двоє: міграції (V16 — таблиці з UNIQUE, яких V20 у H2 не прибирає,
  # бо шукає їх за назвами PostgreSQL) і Hibernate (без UNIQUE) — і результат залежав від порядку тестів.
  # Міграції однаково виконуються на справжньому PostgreSQL при кожному запуску застосунку.
  flyway:
    enabled: false

# 2. Секція логування (З САМОГО ПОЧАТКУ, на одному рівні зі spring)
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

    # 1. Для Hibernate 6+ (показує параметри, які біндяться до запиту)
    org.hibernate.orm.jdbc.bind: TRACE

    # 2. Додатково для відображення результатів завантаження
    org.hibernate.orm.results.loading: TRACE

    # 3. Для Spring Data (показує параметри на рівні репозиторіїв)
    org.springframework.orm.jpa: DEBUG


