spring:
  application:
    name: smart
  # секрети не зберігаємо в git: пароль до бази — у файлі secrets.properties (поруч з pom.xml, у .gitignore;
  # зразок — secrets.example.properties) або в змінній середовища DB_PASSWORD (на сервері).
  # optional: — якщо файлу немає (сервер), не падати: значення прийдуть зі змінних середовища
  config:
    import: optional:file:./secrets.properties
  datasource:
    # ${НАЗВА:запасне} — взяти НАЗВА зі змінної середовища / secrets.properties, а якщо її немає — запасне
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school}
    username: ${DB_USERNAME:admin}
    # без запасного значення: немає DB_PASSWORD — застосунок не стартує і прямо про це скаже
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    # сесія з базою закривається разом із транзакцією сервісу, а не тримається до кінця малювання сторінки.
    # Шаблон отримує готові DTO; якщо десь лишився лінивий зв'язок — буде помилка 500, а не тихі зайві запити
    open-in-view: false
    ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # проти N+1: пов'язані дані (групи учня, учні уроку, ціни курсу…) Hibernate довантажує не по одному
        # запиту на кожен рядок списку, а пачками — WHERE id IN (?, ?, … до 50 значень)
        default_batch_fetch_size: 50
  flyway:
    baseline-on-migrate: true
    # db/migration — спільні міграції; db/vendor/{vendor} — лише для конкретної бази
    # (Spring підставляє postgresql або h2), напр. V25 з індексом lower(name), якого H2 не знає
    locations: classpath:db/migration, classpath:db/vendor/{vendor}
logging:
  level:
    root: INFO                        # Загальний рівень для всього проєкту
    org.springframework.web: INFO     # Логування веб-запитів Spring
    org.hibernate.SQL: INFO          # НЕ показувати SQL-запити у консолі (якщо є JPA)
  file:
    name: smart.log
    path: /
      # 3. Ротація файлів (архівація старих логів)
    logback:
      rollingpolicy:
        file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz" # Формат архівних файлів
        max-file-size: 10MB             # Максимальний розмір одного файлу
        max-history: 30                 # Зберігати логи за останні 30 днів
        total-size-cap: 2GB             # Максимальний сумарний об'єм усіх логів
  # 4. Формат виведення повідомлень (Pattern)
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
