<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Користувачі')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('users')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Користувачі</h1>
                <div class="page-subtitle">Хто може входити в систему</div>
            </div>
        </div>

        <!-- паролі не показуємо; додавання / редагування / видалення — разом з К6 (безпека: шифрування паролів, ролі) -->
        <div class="alert alert-light border d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-info-circle"></i>
            Керування користувачами (додавання, зміна пароля, ролі) з'явиться разом з оновленням безпеки.
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Ім'я</th>
                        <th scope="col">Роль</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user, index : ${users}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium"><i class="bi bi-person-circle text-muted me-1"></i><span th:text="${user.name}"></span></td>
                        <td><span class="badge text-bg-light border fw-semibold" th:text="${user.role}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
