<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<!-- інші помилки в контролерах (GlobalExceptionHandler.handleGeneralException); stackTrace — тільки в smart.log -->
<head th:replace="~{fragments/layout :: head('Помилка')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('')}"></th:block>

    <main class="app-main">
        <div class="error-page">
            <div class="error-code text-danger" th:text="${status != null} ? ${status} : 'Упс!'">500</div>
            <h1 class="h4 fw-bold" th:text="${error != null} ? ${error} : 'Сталася непередбачувана помилка'">Внутрішня помилка сервера</h1>
            <p class="text-muted"
               th:text="${message != null} ? ${message} : 'На сервері виникли технічні неполадки. Будь ласка, спробуйте пізніше.'">
                Щось пішло не так на нашому боці.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="javascript:history.go(-1)" class="btn btn-light"><i class="bi bi-arrow-left"></i> Назад</a>
                <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> На головну</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
