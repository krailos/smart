<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<!-- "не знайдено": запис, адреса, id не число (GlobalExceptionHandler.handleResourceNotFound) -->
<head th:replace="~{fragments/layout :: head('Сторінку не знайдено')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('')}"></th:block>

    <main class="app-main">
        <div class="error-page">
            <div class="error-code text-primary" th:text="${status != null} ? ${status} : '404'">404</div>
            <h1 class="h4 fw-bold" th:text="${error != null} ? ${error} : 'Сторінку не знайдено'">Сторінку не знайдено</h1>
            <p class="text-muted"
               th:text="${message != null} ? ${message} : 'Можливо, адреса містить помилку або сторінку було видалено.'">
                Можливо, адреса містить помилку або сторінку було видалено.
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="javascript:history.go(-1)" class="btn btn-light"><i class="bi bi-arrow-left"></i> Назад</a>
                <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> На головну</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
