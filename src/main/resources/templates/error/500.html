<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<!-- Цю сторінку показує сам Spring Boot (BasicErrorController) для помилок поза контролерами:
     у шаблоні Thymeleaf, у фільтрах безпеки. Його ${error} — англійською, ${message} — порожній,
     тому тексти тут постійні, без th:text -->
<head th:replace="~{fragments/layout :: head('Помилка сервера')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('')}"></th:block>

    <main class="app-main">
        <div class="error-page">
            <div class="error-code text-danger">500</div>
            <h1 class="h4 fw-bold">Внутрішня помилка сервера</h1>
            <p class="text-muted">На сервері сталася непередбачувана помилка. Спробуйте пізніше або поверніться на головну.</p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="javascript:history.go(-1)" class="btn btn-light"><i class="bi bi-arrow-left"></i> Назад</a>
                <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> На головну</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
