<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
    Спільні шматки (фрагменти) для всіх сторінок. Сторінка підключає їх так:
      <head th:replace="~{fragments/layout :: head('Вчителі')}"></head>
      <th:block th:replace="~{fragments/layout :: sidebar('teachers')}"></th:block>
      <th:block th:replace="~{fragments/layout :: alerts}"></th:block>
    Параметр sidebar — ключ розділу, який треба підсвітити в меню.
-->

<!-- head(title): стилі, іконки, скрипти; title — заголовок вкладки браузера -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Smartum'">Smartum</title>
    <link rel="icon" th:href="@{/favicon.ico}"/>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous" defer></script>
    <!-- Tom Select: випадаючий список з пошуком за літерами (учнів сотні — гортати довго).
         Вмикається для кожного <select data-search>; під капотом лишається звичайний select,
         тож required, th:field і попередньо вибране значення працюють як раніше -->
    <link
            href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.bootstrap5.min.css"
            rel="stylesheet"
            integrity="sha384-oNaL7h8UJDHZ8k9XxysQRnqKxysB2lmlq7uU5Ic9CsOy89U4US8mT9pGYFf0ygyM"
            crossorigin="anonymous"/>
    <script
            src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"
            integrity="sha384-A4TlP4zHVPP9oVIQ8pTVaV6MhvBkDx1sRpmEUfAlO5e7xpodrdr6uNmUV7alXAWW"
            crossorigin="anonymous" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('select[data-search]').forEach(el => new TomSelect(el, {
                create: false,      // лише учні зі списку, нових не вигадуємо
                maxOptions: null,   // без обмеження 50 пунктів — показати всіх, хто підходить
                placeholder: 'Почніть вводити прізвище або телефон…'
            }));
        });
    </script>
</head>

<body>

<!-- sidebar(active): бічне меню. На вузькому екрані (телефон) ховається, відкривається кнопкою ☰ зверху -->
<th:block th:fragment="sidebar(active)">
    <!-- верхня смужка тільки для телефона -->
    <div class="app-topbar d-lg-none">
        <button class="btn btn-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar" aria-label="Меню">
            <i class="bi bi-list fs-5"></i>
        </button>
        <a class="app-brand" th:href="@{/}"><i class="bi bi-mortarboard-fill"></i> Smartum</a>
    </div>

    <div class="app-sidebar">
        <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
            <div class="offcanvas-header">
                <span class="app-brand" id="sidebarLabel"><i class="bi bi-mortarboard-fill"></i> Smartum</span>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                        aria-label="Закрити"></button>
            </div>
            <div class="offcanvas-body d-flex flex-column w-100">
                <div class="sidebar-inner">
                    <a class="app-brand d-none d-lg-flex" th:href="@{/}"><i class="bi bi-mortarboard-fill"></i> Smartum</a>

                    <div class="nav-section">Навчання</div>
                    <a th:href="@{/schedules}" class="nav-item-link" th:classappend="${active == 'schedules'} ? 'active'">
                        <i class="bi bi-calendar-week"></i> Розклад</a>
                    <a th:href="@{/lessons}" class="nav-item-link" th:classappend="${active == 'lessons'} ? 'active'">
                        <i class="bi bi-journal-check"></i> Уроки</a>
                    <!-- вчителю: учні його груп (адміну — повний розділ «Учні» нижче) -->
                    <a sec:authorize="hasAuthority('TEACHER')" th:href="@{/my/students}" class="nav-item-link"
                       th:classappend="${active == 'myStudents'} ? 'active'">
                        <i class="bi bi-person-video2"></i> Мої учні</a>

                    <!-- далі — тільки адміну (вчителю ці сторінки однаково закриті: SecurityConfiguration) -->
                    <th:block sec:authorize="hasAuthority('ADMIN')">
                    <a th:href="@{/gangs}" class="nav-item-link" th:classappend="${active == 'gangs'} ? 'active'">
                        <i class="bi bi-people"></i> Групи</a>
                    <a th:href="@{/subjects}" class="nav-item-link" th:classappend="${active == 'subjects'} ? 'active'">
                        <i class="bi bi-book"></i> Курси</a>
                    <a th:href="@{/audiences}" class="nav-item-link" th:classappend="${active == 'audiences'} ? 'active'">
                        <i class="bi bi-door-open"></i> Аудиторії</a>

                    <div class="nav-section">Люди</div>
                    <a th:href="@{/students}" class="nav-item-link" th:classappend="${active == 'students'} ? 'active'">
                        <i class="bi bi-person-video2"></i> Учні</a>
                    <a th:href="@{/teachers}" class="nav-item-link" th:classappend="${active == 'teachers'} ? 'active'">
                        <i class="bi bi-person-badge"></i> Вчителі</a>

                    <div class="nav-section">Фінанси</div>
                    <a th:href="@{/payments}" class="nav-item-link" th:classappend="${active == 'payments'} ? 'active'">
                        <i class="bi bi-cash-coin"></i> Платежі</a>
                    <a th:href="@{/discounts}" class="nav-item-link" th:classappend="${active == 'discounts'} ? 'active'">
                        <i class="bi bi-percent"></i> Знижки</a>
                    <a th:href="@{/reports}" class="nav-item-link" th:classappend="${active == 'reports'} ? 'active'">
                        <i class="bi bi-bar-chart-line"></i> Звіти</a>

                    <div class="nav-section">Адміністрування</div>
                    <a th:href="@{/users}" class="nav-item-link" th:classappend="${active == 'users'} ? 'active'">
                        <i class="bi bi-person-gear"></i> Користувачі</a>
                    <a th:href="@{/help}" class="nav-item-link" th:classappend="${active == 'help'} ? 'active'">
                        <i class="bi bi-question-circle"></i> Довідка</a>
                    </th:block>

                    <!-- хто увійшов + свій пароль -->
                    <div class="mt-auto pt-3">
                        <!-- логін як є (великі/малі літери в ньому важливі), без верхнього регістру заголовків меню -->
                        <div class="nav-section text-transform-none" th:if="${#authentication != null}">
                            <i class="bi bi-person-circle"></i> <span th:text="${#authentication.name}"></span></div>
                        <a th:href="@{/account/password}" class="nav-item-link" th:classappend="${active == 'account'} ? 'active'">
                            <i class="bi bi-key"></i> Змінити мій пароль</a>
                    </div>

                    <!-- вихід — POST-запит, тому форма, а не посилання -->
                    <form th:action="@{/logout}" method="post">
                        <button class="nav-item-link w-100 border-0 bg-transparent text-start" type="submit">
                            <i class="bi bi-box-arrow-left"></i> Вийти
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>

<!-- alerts: повідомлення після дії (flash-атрибути successMessage / errorMessage після редиректу) -->
<th:block th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-check-circle"></i><span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}"></span>
    </div>
</th:block>

</body>
</html>
