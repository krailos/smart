<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова знижка')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('discounts')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Нова знижка</h1>
                <div class="page-subtitle"><a th:href="@{/discounts}">Знижки</a> / нова</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/discounts/create}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="name" class="form-label">Вид знижки</label>
                            <input class="form-control" id="name" type="text" name="name"/>
                        </div>
                        <div class="col-md-4">
                            <label for="value" class="form-label">Знижка, %</label>
                            <input class="form-control" id="value" type="number" min="0" max="100" step="1" name="value"/>
                        </div>
                        <div class="col-md-4">
                            <label for="date" class="form-label">Діє з</label>
                            <input class="form-control" id="date" type="date" name="date"/>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/discounts}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
