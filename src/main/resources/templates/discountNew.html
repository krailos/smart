<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова знижка')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('discounts')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Нова знижка</h1>
                <div class="page-subtitle"><a th:href="@{/discounts}">Знижки</a> / нова</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/discounts/create}" th:object="${discount}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="name" class="form-label">Вид знижки</label>
                            <input class="form-control" type="text" maxlength="50" required th:field="*{name}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="value" class="form-label">Знижка, %</label>
                            <input class="form-control" type="number" min="1" max="100" step="1" required th:field="*{value}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{value}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="date" class="form-label">Діє з</label>
                            <input class="form-control" type="date" required th:field="*{date}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{date}"></div>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/discounts}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
