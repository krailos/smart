<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вчитель')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('teachers')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${teacher.lastName + ' ' + teacher.firstName}">Вчитель</h1>
                <div class="page-subtitle"><a th:href="@{/teachers}">Вчителі</a> / редагування</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:object="${teacher}" th:action="@{/teachers/{id}/update ( id=${teacher.id}) }" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="lastName" class="form-label">Прізвище</label>
                            <input class="form-control" id="lastName" type="text" name="lastName" th:value="*{lastName}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="firstName" class="form-label">Ім'я</label>
                            <input class="form-control" id="firstName" type="text" name="firstName" th:value="*{firstName}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="secondName" class="form-label">По батькові</label>
                            <input class="form-control" id="secondName" type="text" name="secondName" th:value="*{secondName}"/>
                        </div>

                        <div class="col-md-4">
                            <label for="phone" class="form-label">Телефон</label>
                            <input class="form-control" id="phone" type="text" name="phone" th:value="*{phone}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">Email</label>
                            <input class="form-control" id="email" type="email" name="email" th:value="*{email}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="birthDate" class="form-label">Дата народження</label>
                            <input class="form-control" id="birthDate" type="date" name="birthDate" th:value="*{birthDate}"/>
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label">Адреса</label>
                            <input class="form-control" id="address" type="text" name="address" th:value="*{address}"/>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      th:text="*{description}"></textarea>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/teachers}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
