<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ціни')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('subjects')}"></th:block>

    <!-- одна сторінка на два випадки:
         /prices              — усі ціни всіх курсів (subject немає);
         /subjects/{id}/prices — історія цін одного курсу (subject є, можна додати нову ціну) -->
    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${subject != null} ? 'Ціни: ' + ${subject.name} : 'Усі ціни'">Ціни</h1>
                <div class="page-subtitle">
                    <a th:href="@{/subjects}">Курси</a>
                    <span th:text="${subject != null} ? ' / ' + ${subject.name} + ' / ціни' : ' / усі ціни'"></span>
                </div>
            </div>
            <div class="page-actions">
                <a th:if="${subject != null}" th:href="@{/subjects/{id}/prices/new(id=${subject.id})}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Нова ціна
                </a>
            </div>
        </div>

        <!-- помилка редагування ціни (flash-повідомлення) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col" th:if="${subject == null}">Курс</th>
                        <th scope="col">Діє з</th>
                        <th scope="col">Вартість уроку</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="price, index : ${prices}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td th:if="${subject == null}" class="fw-medium" th:text="${price.subjectName}"></td>
                        <td th:text="${price.date != null} ? ${#temporals.format(price.date, 'dd.MM.yyyy')}"></td>
                        <td class="fw-semibold" th:text="${#numbers.formatDecimal(price.value, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="col-actions">
                            <a th:href="@{/prices/{id}(id=${price.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- м'яке видалення (@SoftDelete): в історії уроків ціна лишається -->
                            <form th:action="@{/prices/{id}/delete( id=${price.id})}" method="post"
                                  onsubmit="return confirm('Видалити ціну?');">
                                <button class="btn btn-light btn-icon text-danger" title="Видалити"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(prices)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-tags"></i>
                            Цін ще немає
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
