<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>gangs</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous" />
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg" style="background-color: #edeff1"
		data-bs-theme="light">
		<div class="container">
			<a class="navbar-brand" href="/">Smartum</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item"><a th:href="@{/gangs/gang/new}">
							<button class="btn btn-success">Додати групу</button>
					</a></li>
					<!-- перемикач: активні / архів -->
					<li class="nav-item ms-2"><a class="btn btn-outline-secondary"
						th:href="${archived} ? @{/gangs} : @{/gangs(archived=true)}"
						th:text="${archived} ? 'Активні групи' : 'Архів'"></a></li>
				</ul>
			</div>
		</div>
	</nav>
	<div class="container my-4">
		<div class="text-center text-uppercase fs-5 fw-bolder" th:text="${archived} ? 'ГРУПИ — АРХІВ' : 'ГРУПИ'">ГРУПИ</div>
		<div class="row">
			<!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
			<div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
			<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
			<table class="table table-striped">
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col">Назва</th>
						<th scope="col">Курс</th>
						<th scope="col">Викладач</th>
						<th scope="col">К-сть студентів</th>
						<th scope="col">Опис</th>
						<th scope="col">Cтуденти</th>
						<th scope="col">Редагувати</th>
						<th scope="col">Архів</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="gang, index : ${gangs}">
						<td th:text="${index.count}"></td>
						<td th:text="${gang.name}"></td>
						<td th:text="${gang.subjectNme}"></td>
						<td th:text="${gang.teacherLastName}"></td>
						<td th:text="${gang.gangsStudentsDto.size()}"></td>
						<td th:text="${gang.description}"></td>
						<td><a th:href="@{/gangs/{id}/bystudents(id=${gang.id})}">
                                <button class="btn btn-primary">студенти</button>
                        </a></td>
						<td><a th:href="@{gangs/{id}(id=${gang.id})}">
								<button class="btn btn-primary">група</button>
						</a></td>

						<td>
							<!-- архівування замість видалення: проведені уроки групу пам'ятають -->
							<form th:unless="${archived}" th:action="@{/gangs/{id}/archive( id=${gang.id})}"
								method="post" onsubmit="return confirm('Перемістити групу в архів?');">
								<button class="btn btn-outline-danger">В архів</button>
							</form>
							<form th:if="${archived}" th:action="@{/gangs/{id}/restore( id=${gang.id})}" method="post">
								<button class="btn btn-outline-success">Відновити</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
