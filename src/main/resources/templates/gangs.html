<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Групи')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('gangs')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Групи
                    <span th:if="${archived}" class="badge text-bg-secondary align-middle fs-6 fw-semibold">Архів</span>
                </h1>
                <div class="page-subtitle" th:text="'Усього: ' + ${gangs.size()}"></div>
            </div>
            <div class="page-actions">
                <!-- перемикач: активні / архів -->
                <div class="btn-group" role="group">
                    <a th:href="@{/gangs}" class="btn"
                       th:classappend="${archived} ? 'btn-outline-secondary' : 'btn-secondary'">Активні</a>
                    <a th:href="@{/gangs(archived=true)}" class="btn"
                       th:classappend="${archived} ? 'btn-secondary' : 'btn-outline-secondary'"><i class="bi bi-archive"></i> Архів</a>
                </div>
                <a th:href="@{/gangs/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати групу
                </a>
            </div>
        </div>

        <!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Назва</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Вчитель</th>
                        <th scope="col">Учні</th>
                        <th scope="col">Опис</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="gang, index : ${gangs}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium" th:text="${gang.name}"></td>
                        <td th:text="${gang.subjectNme}"></td>
                        <td th:text="${gang.teacherLastName}"></td>
                        <td>
                            <a th:href="@{/gangs/{id}/bystudents(id=${gang.id})}"
                               class="badge rounded-pill text-bg-light border text-decoration-none fw-semibold" title="Учні групи">
                                <i class="bi bi-person-video2"></i> <span th:text="${gang.gangsStudentsDto.size()}"></span>
                            </a>
                        </td>
                        <td class="text-muted small" th:text="${gang.description}"></td>
                        <td class="col-actions">
                            <a th:href="@{/gangs/{id}(id=${gang.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- архівування замість видалення: проведені уроки групу пам'ятають -->
                            <form th:unless="${archived}" th:action="@{/gangs/{id}/archive( id=${gang.id})}"
                                  method="post" onsubmit="return confirm('Перемістити групу в архів?');">
                                <button class="btn btn-light btn-icon text-danger" title="В архів"><i class="bi bi-archive"></i></button>
                            </form>
                            <form th:if="${archived}" th:action="@{/gangs/{id}/restore( id=${gang.id})}" method="post">
                                <button class="btn btn-light btn-icon text-success" title="Відновити"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(gangs)}">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-people"></i>
                            <span th:text="${archived} ? 'В архіві немає груп' : 'Груп немає'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
