<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>students</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"/>
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: #edeff1"
     data-bs-theme="light">
    <div class="container">
        <a class="navbar-brand" href="/">Smartum</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a th:href="@{/students/student/new}">
                    <button class="btn btn-success">Додати cтудента</button>
                </a></li>

                <li class="nav-item">
                    <!-- Форма пошуку за ключовим словом -->
                    <form th:action="@{/students}" method="get" class="row g-3 mb-4">
                        <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                        <input type="hidden" name="sortDir" th:value="${sortDir}"/>

                        <div class="col-auto">
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Пошук за прізвищем...">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">Знайти</button>
                            <a th:href="@{/students}" class="btn btn-secondary">Скинути</a>
                        </div>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>
<div class="container my-4">
    <div class="row">
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">
                    <a th:href="@{/students(page=${currentPage}, sortBy='id', sortDir=${reverseSortDir})}">
                        ID <span th:if="${sortBy == 'id'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>

                <th scope="col">
                    <a th:href="@{/students(page=${currentPage}, sortBy='lastName', sortDir=${reverseSortDir})}">
                        Прізвище <span th:if="${sortBy == 'lastName'}"
                                       th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
                    </a>
                </th>

                <th scope="col">Імя</th>
                <th scope="col">Батьки</th>
                <th scope="col">Телефон</th>
                <th scope="col">Статус</th>
                <th scope="col">Групи</th>
                <th scope="col">Знижки</th>
                <th scope="col">Баланс</th>
                <th scope="col">Редагувати</th>
                <th scope="col">Видалити</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student, index : ${studentPage.content}">
                <td th:text="${index.count}"></td>
                <td th:text="${student.id}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.contactName}"></td>
                <td th:text="${student.phone}"></td>
                <td th:text="${student.studentStatus}"></td>

                <td><a th:href="@{/gangs/{id}/byStudent (id=${student.id})}">
                    <button class="btn btn-primary" th:text="${student.getGangsStudents().size()}">Групи</button>
                </a></td>
                <td><a th:href="@{/studentsDiscounts/{id}/byStudent (id=${student.id}) }">
                    <button class="btn btn-primary" th:text="${student.getStudentsDiscounts().size()}">Знижки</button>
                </a>
                </td>
                <td th:text="${student.balance}"></td>
                <td>
                    <a th:href="@{/students/{id} (id=${student.id}) }">
                        <button class="btn btn-success">Редагувати</button>
                    </a>

                    <!--form th:action="@{/students/{id}/update( id=${student.id})}"
                          method="post">
                        <button class="btn btn-danger">Редагувати</button>
                    </form-->

                </td>
                <td>
                    <form th:action="@{/students/{id}/delete( id=${student.id})}"
                          method="post">
                        <button class="btn btn-danger">Видалити</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Пагінація -->
        <nav aria-label="Page navigation" th:if="${studentPage.totalPages > 1}">
            <ul class="pagination justify-content-center">

                <!-- Кнопка НАЗАД (відключається, якщо сторінка перша) -->
                <li class="page-item" th:classappend="${studentPage.first} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/students(page=${currentPage - 1}, size=${studentPage.size})}">Назад</a>
                </li>

                <!-- Цикл по всіх номерах сторінок -->
                <!-- th:sequence(0, N) створює масив номерів від 0 до N -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, studentPage.totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/students(page=${i}, size=${studentPage.size})}" th:text="${i + 1}">1</a>
                </li>

                <!-- Кнопка ВПЕРЕД (відключається, якщо сторінка остання) -->
                <li class="page-item" th:classappend="${studentPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${currentPage + 1}, size=${studentPage.size})}">Вперед</a>
                </li>

            </ul>
        </nav>


    </div>
</div>
</body>
</html>
