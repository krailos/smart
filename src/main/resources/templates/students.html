<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Учні')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('students')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Учні
                    <span th:if="${archived}" class="badge text-bg-secondary align-middle fs-6 fw-semibold">Архів</span>
                </h1>
                <div class="page-subtitle" th:text="'Усього: ' + ${studentPage.totalElements}"></div>
            </div>
            <div class="page-actions">
                <!-- перемикач: активні / архів -->
                <div class="btn-group" role="group">
                    <a th:href="@{/students}" class="btn"
                       th:classappend="${archived} ? 'btn-outline-secondary' : 'btn-secondary'">Активні</a>
                    <a th:href="@{/students(archived=true)}" class="btn"
                       th:classappend="${archived} ? 'btn-secondary' : 'btn-outline-secondary'"><i class="bi bi-archive"></i> Архів</a>
                </div>
                <a th:href="@{/students/student/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати учня
                </a>
            </div>
        </div>

        <!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <!-- Форма пошуку за прізвищем -->
            <div class="card-header bg-transparent py-3">
                <form th:action="@{/students}" method="get" class="d-flex flex-wrap gap-2">
                    <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                    <input type="hidden" name="sortDir" th:value="${sortDir}"/>
                    <!-- шукаємо в тому ж списку: серед активних або в архіві -->
                    <input type="hidden" name="archived" th:value="${archived}"/>
                    <div class="input-group" style="max-width: 360px">
                        <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                               placeholder="Пошук за прізвищем...">
                    </div>
                    <button type="submit" class="btn btn-primary">Знайти</button>
                    <a th:if="${!#strings.isEmpty(keyword)}" th:href="@{/students(archived=${archived})}" class="btn btn-light">Скинути</a>
                </form>
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <!-- заголовки з сортуванням: клік — сортувати, ще клік — у зворотному порядку; пошук зберігається -->
                        <th scope="col">
                            <a class="text-reset text-decoration-none"
                               th:href="@{/students(archived=${archived}, keyword=${keyword}, page=${currentPage}, sortBy='id', sortDir=${reverseSortDir})}">
                                ID <i th:if="${sortBy == 'id'}" th:class="${sortDir == 'asc'} ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                            </a>
                        </th>
                        <th scope="col">
                            <a class="text-reset text-decoration-none"
                               th:href="@{/students(archived=${archived}, keyword=${keyword}, page=${currentPage}, sortBy='lastName', sortDir=${reverseSortDir})}">
                                Учень <i th:if="${sortBy == 'lastName'}" th:class="${sortDir == 'asc'} ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                            </a>
                        </th>
                        <th scope="col">Контакт</th>
                        <th scope="col">Статус</th>
                        <th scope="col">Групи</th>
                        <th scope="col">Знижки</th>
                        <th scope="col" class="text-end">
                            <a class="text-reset text-decoration-none"
                               th:href="@{/students(archived=${archived}, keyword=${keyword}, page=${currentPage}, sortBy='balance', sortDir=${reverseSortDir})}">
                                Баланс <i th:if="${sortBy == 'balance'}" th:class="${sortDir == 'asc'} ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'"></i>
                            </a>
                        </th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${studentPage.content}">
                        <td class="text-muted" th:text="${student.id}"></td>
                        <td class="fw-medium" th:text="${student.lastName + ' ' + student.firstName}"></td>
                        <td>
                            <div th:text="${student.contactName}"></div>
                            <div class="small text-muted" th:text="${student.phone}"></div>
                        </td>
                        <td>
                            <span th:if="${student.studentStatus != null}" class="badge rounded-pill"
                                  th:classappend="${student.studentStatus.name() == 'УЧЕНЬ'} ? 'text-bg-success'
                                                : (${student.studentStatus.name() == 'ЛІД'} ? 'text-bg-primary'
                                                : (${student.studentStatus.name() == 'ТЕСТ'} ? 'text-bg-warning' : 'text-bg-secondary'))"
                                  th:text="${student.studentStatus}"></span>
                        </td>
                        <td>
                            <a th:href="@{/students/{id}/gangs(id=${student.id})}"
                               class="badge rounded-pill text-bg-light border text-decoration-none fw-semibold" title="Групи учня">
                                <i class="bi bi-people"></i> <span th:text="${student.getGangsStudents().size()}"></span>
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/students/{id}/discounts(id=${student.id})}"
                               class="badge rounded-pill text-bg-light border text-decoration-none fw-semibold" title="Знижки учня">
                                <i class="bi bi-percent"></i> <span th:text="${student.getStudentsDiscounts().size()}"></span>
                            </a>
                        </td>
                        <!-- борг (мінус) — червоним, переплата — зеленим -->
                        <td class="text-end fw-semibold text-nowrap"
                            th:classappend="${student.balance != null and student.balance < 0} ? 'text-danger'
                                          : (${student.balance != null and student.balance > 0} ? 'text-success')"
                            th:text="${student.balance != null} ? ${#numbers.formatDecimal(student.balance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="col-actions">
                            <a th:href="@{/students/{id} (id=${student.id}) }" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- архівування замість видалення: уроки, оплати й баланс учня лишаються -->
                            <form th:unless="${archived}" th:action="@{/students/{id}/archive( id=${student.id})}"
                                  method="post" onsubmit="return confirm('Перемістити учня в архів?');">
                                <button class="btn btn-light btn-icon text-danger" title="В архів"><i class="bi bi-archive"></i></button>
                            </form>
                            <form th:if="${archived}" th:action="@{/students/{id}/restore( id=${student.id})}" method="post">
                                <button class="btn btn-light btn-icon text-success" title="Відновити"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${studentPage.content.isEmpty()}">
                        <td colspan="8" class="empty-state">
                            <i class="bi bi-person-video2"></i>
                            <span th:text="${!#strings.isEmpty(keyword)} ? 'Нікого не знайдено' : (${archived} ? 'В архіві немає учнів' : 'Ще немає жодного учня')"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Пагінація (сортування й пошук зберігаються при переході між сторінками) -->
            <div class="card-footer bg-transparent py-3" th:if="${studentPage.totalPages > 1}">
                <nav aria-label="Сторінки">
                    <ul class="pagination justify-content-center mb-0">
                        <!-- Кнопка НАЗАД (відключається, якщо сторінка перша) -->
                        <li class="page-item" th:classappend="${studentPage.first} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/students(archived=${archived}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir}, page=${currentPage - 1}, size=${studentPage.size})}">
                                <i class="bi bi-chevron-left"></i></a>
                        </li>
                        <!-- th:sequence(0, N) створює масив номерів від 0 до N -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, studentPage.totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:href="@{/students(archived=${archived}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir}, page=${i}, size=${studentPage.size})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        <!-- Кнопка ВПЕРЕД (відключається, якщо сторінка остання) -->
                        <li class="page-item" th:classappend="${studentPage.last} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/students(archived=${archived}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir}, page=${currentPage + 1}, size=${studentPage.size})}">
                                <i class="bi bi-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>
</body>
</html>
