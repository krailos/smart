<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Платіж')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('payments')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Платіж
                    <span th:if="${payment.storned}" class="badge text-bg-secondary align-middle fs-6">Сторновано</span>
                    <span th:if="${payment.stornoOfId != null}" class="badge text-bg-danger align-middle fs-6">Сторно іншої оплати</span>
                </h1>
                <div class="page-subtitle"><a th:href="@{/payments}">Платежі</a> / перегляд</div>
            </div>
        </div>

        <!-- оплати не редагуються: тільки перегляд; помилку виправляють сторнуванням -->
        <div class="card form-card">
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="form-label text-muted">Учень</div>
                        <div class="fs-5 fw-semibold" th:text="|${payment.student.lastName} ${payment.student.firstName}|"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-label text-muted">Сума</div>
                        <div class="fs-5 fw-semibold" th:classappend="${payment.value < 0} ? 'text-danger' : 'text-success'"
                             th:text="${#numbers.formatDecimal(payment.value, 1, 'WHITESPACE', 2, 'POINT') + ' грн'}"></div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-label text-muted">Дата</div>
                        <div class="fs-5" th:text="${payment.date != null} ? ${#temporals.format(payment.date, 'dd.MM.yyyy')}"></div>
                    </div>
                    <div class="col-12">
                        <div class="form-label text-muted">Примітка</div>
                        <div th:text="${#strings.isEmpty(payment.description)} ? '—' : ${payment.description}"></div>
                    </div>

                    <div class="col-12 form-actions">
                        <form th:if="${payment.stornoOfId == null and !payment.storned}"
                              th:action="@{/payments/{id}/storno (id=${payment.id})}" method="post"
                              onsubmit="return confirm('Сторнувати цю оплату? Буде створено запис з мінусовою сумою, баланс учня зменшиться.');">
                            <button type="submit" class="btn btn-warning"><i class="bi bi-arrow-return-left"></i> Сторнувати</button>
                        </form>
                        <a th:href="@{/payments}" class="btn btn-light">До списку</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
