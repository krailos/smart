<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова ціна')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('subjects')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Нова ціна</h1>
                <div class="page-subtitle">
                    <a th:href="@{/subjects}">Курси</a> /
                    <a th:href="@{/prices/{id}/bysubject(id=${price.subjectId})}" th:text="${price.subjectName}">курс</a> / нова ціна
                </div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/prices/create}" method="post" th:object="${price}">
                    <input type="hidden" th:field="*{subjectId}"/>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="subName" class="form-label">Курс</label>
                            <input class="form-control bg-light" id="subName" type="text"
                                   th:name="subjectName" th:value="*{subjectName}" readonly/>
                        </div>
                        <div class="col-md-4">
                            <label for="value" class="form-label">Вартість уроку, грн</label>
                            <input class="form-control" id="value" type="number" min="0" step="0.01" th:name="value" value="" required/>
                        </div>
                        <div class="col-md-4">
                            <label for="date" class="form-label">Діє з</label>
                            <input class="form-control" id="date" type="date" th:name="date" value=""/>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/prices/{id}/bysubject(id=${price.subjectId})}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
