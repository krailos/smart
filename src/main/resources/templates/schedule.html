<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редагування розкладу')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('schedules')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Редагування розкладу</h1>
                <div class="page-subtitle">
                    <a th:href="@{/schedules}">Розклад</a> /
                    <span th:text="${schedule.weekDay + ' ' + schedule.startTime + '–' + schedule.endTime}"></span>
                </div>
            </div>
        </div>

        <!-- Помилка конфлікту розкладу (кабінет / вчитель / група / учні зайняті) -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}"></span>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/schedules/{id}/update(id=${schedule.id})}" th:object="${schedule}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="lesson" class="form-label">Курс</label>
                            <select id="lesson" th:field="*{subjectId}" class="form-select">
                                <option value="">-- курс --</option>
                                <option th:each="subject : ${subjects}"
                                        th:value="${subject.id}"
                                        th:text="${subject.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="gang" class="form-label">Група</label>
                            <select id="gang" th:field="*{gangId}" class="form-select">
                                <option value="">-- група --</option>
                                <option th:each="gang : ${gangs}"
                                        th:value="${gang.id}"
                                        th:text="${gang.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="teacher" class="form-label">Вчитель</label>
                            <select id="teacher" th:field="*{teacherId}" class="form-select">
                                <option value="">-- основний вчитель групи --</option>
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.lastName + ' ' + teacher.firstName}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="weekday" class="form-label">День</label>
                            <select id="weekday" th:field="*{weekDay}" class="form-select">
                                <option value="">-- день --</option>
                                <option th:each="weekday : ${weekDays}"
                                        th:value="${weekday}"
                                        th:text="${weekday}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="startTime" class="form-label">Початок</label>
                            <input type="time" id="startTime" th:field="*{startTime}" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label for="endTime" class="form-label">Кінець</label>
                            <input type="time" id="endTime" th:field="*{endTime}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="audienceDto" class="form-label">Аудиторія</label>
                            <select id="audienceDto" th:field="*{audienceId}" class="form-select">
                                <option value="">-- аудиторія --</option>
                                <option th:each="audience : ${audiences}"
                                        th:value="${audience.id}"
                                        th:text="${audience.name}"></option>
                            </select>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/schedules}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
