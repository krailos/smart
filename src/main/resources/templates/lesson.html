<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редагування уроку')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('lessons')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Редагування уроку</h1>
                <!-- курс і група не редагуються -->
                <div class="page-subtitle">
                    <a th:href="@{/lessons}">Уроки</a> /
                    <span th:text="${lesson.subjectName}"></span> · група <span th:text="${lesson.gangName}"></span>
                </div>
            </div>
        </div>

        <!-- Помилка: на цю дату вже є урок з цього розкладу, не вказана дата -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/lessons/{id}/update(id=${lesson.id})}" th:object="${lesson}" method="post">
            <!-- курс і група не змінюються, але потрібні для збереження -->
            <input type="hidden" th:field="*{subjectId}"/>
            <input type="hidden" th:field="*{gangId}"/>

            <div class="card form-card mb-3">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="teacher" class="form-label">Вчитель (провів урок)</label>
                            <select id="teacher" th:field="*{teacherId}" class="form-select">
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.lastName + ' ' + teacher.firstName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="audience" class="form-label">Аудиторія</label>
                            <select id="audience" th:field="*{audienceId}" class="form-select">
                                <option th:each="audience : ${audiences}"
                                        th:value="${audience.id}"
                                        th:text="${audience.name}"></option>
                            </select>
                        </div>
                        <!-- дату можна змінити; час — тільки перегляд (його задає розклад) -->
                        <div class="col-md-4">
                            <label for="date" class="form-label">Дата</label>
                            <input type="date" id="date" th:field="*{date}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="startTime" class="form-label">Початок</label>
                            <input type="time" id="startTime" th:value="*{startTime}" class="form-control" disabled>
                        </div>
                        <div class="col-md-4">
                            <label for="endTime" class="form-label">Кінець</label>
                            <input type="time" id="endTime" th:value="*{endTime}" class="form-control" disabled>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Учні (тільки перегляд: від присутності й оплати залежить баланс) -->
            <div class="card form-card mb-3">
                <div class="card-header bg-transparent py-3 fw-semibold">Учні на уроці</div>
                <div class="table-responsive">
                    <table class="table table-app">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Учень</th>
                            <th scope="col" class="text-center">Присутній</th>
                            <th scope="col" class="text-center">Платний урок</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ls, index : ${lesson.lessonsStudentsDto}">
                            <td class="text-muted" th:text="${index.count}"></td>
                            <td class="fw-medium" th:text="${ls.studentLastName + ' ' + ls.studentFirstName}"></td>
                            <td class="text-center">
                                <span th:if="${ls.present}" class="badge text-bg-success">так</span>
                                <span th:unless="${ls.present}" class="badge text-bg-secondary">ні</span>
                            </td>
                            <td class="text-center">
                                <span th:if="${ls.payed}" class="badge text-bg-success">так</span>
                                <span th:unless="${ls.payed}" class="badge text-bg-secondary">ні</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-transparent text-muted small">
                    <i class="bi bi-info-circle"></i> Відмітки присутності та оплати тут не змінюються — від них залежить баланс учнів.
                    Помилку виправляють сторнуванням уроку.
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                <a th:href="@{/lessons}" class="btn btn-light">Скасувати</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
