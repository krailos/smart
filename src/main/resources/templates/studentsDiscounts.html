<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Знижки учнів')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('discounts')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Знижки учнів</h1>
                <div class="page-subtitle"><a th:href="@{/discounts}">Знижки</a> / призначені учням</div>
            </div>
            <div class="page-actions">
                <a th:href="@{/studentsDiscounts/studentDiscount/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Призначити знижку
                </a>
            </div>
        </div>

        <!-- помилка: учень уже має цю знижку на цей курс (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Учень</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Вид знижки</th>
                        <th scope="col">Знижка</th>
                        <th scope="col">Дата</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="studentDiscount, index : ${studentsDiscounts}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium" th:text="${studentDiscount.student.lastName + ' ' + studentDiscount.student.firstName}"></td>
                        <td th:text="${studentDiscount.subject.name}"></td>
                        <td th:text="${studentDiscount.discount.name}"></td>
                        <td>
                            <span class="badge rounded-pill text-bg-success" th:text="${studentDiscount.discount.value} + ' %'"></span>
                        </td>
                        <td th:text="${studentDiscount.date != null} ? ${#temporals.format(studentDiscount.date, 'dd.MM.yyyy')}"></td>
                        <td class="col-actions">
                            <a th:href="@{/studentsDiscounts/{id} ( id=${studentDiscount.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- м'яке видалення (@SoftDelete) -->
                            <form th:action="@{/studentsDiscounts/{id}/delete( id=${studentDiscount.id})}" method="post"
                                  onsubmit="return confirm('Видалити знижку учня?');">
                                <button class="btn btn-light btn-icon text-danger" title="Видалити"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(studentsDiscounts)}">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-percent"></i>
                            Знижок ще не призначено
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
