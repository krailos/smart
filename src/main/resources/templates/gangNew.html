<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова група')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('gangs')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Нова група</h1>
                <div class="page-subtitle"><a th:href="@{/gangs}">Групи</a> / нова</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/gangs/create}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="name" class="form-label">Назва групи</label>
                            <input class="form-control" id="name" type="text" name="name" value=""/>
                        </div>
                        <div class="col-md-4">
                            <label for="subjectId" class="form-label">Курс</label>
                            <select class="form-select" id="subjectId" name="subjectId">
                                <option value="">-- Оберіть курс --</option>
                                <option th:each="subject : ${subjects}"
                                        th:value="${subject.id}"
                                        th:text="${subject.name}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="teacherId" class="form-label">Вчитель</label>
                            <select class="form-select" id="teacherId" name="teacherId">
                                <option value="">-- Оберіть вчителя --</option>
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.lastName + ' ' + teacher.firstName}">
                                </option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис групи</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/gangs}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
