<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Початковий баланс')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('students')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Початковий баланс</h1>
                <div class="page-subtitle"><a th:href="@{/students}">Учні</a> /
                    <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.lastName + ' ' + student.firstName}">учень</a>
                    / початковий баланс</div>
            </div>
        </div>

        <!-- Помилка: нульова сума, баланс уже внесено, дата пізніша за перший урок тощо -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}"></span>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <p class="text-muted mb-3">Залишок учня з часу до програми: <b>передоплата</b> — сума з плюсом (500),
                    <b>борг</b> — з мінусом (-1200). Вноситься один раз; якщо помилились — сторнуйте його у
                    <a th:href="@{/payments}">списку платежів</a> і внесіть заново.</p>
                <!-- th:object / th:field / th:errors — як у формі оплати (paymentNew.html) -->
                <form th:action="@{/students/{id}/opening-balance(id=${student.id})}" th:object="${openingBalance}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="value" class="form-label">Сума, грн</label>
                            <!-- без min: від'ємна сума — це борг -->
                            <input class="form-control" type="number" step="0.01" th:field="*{value}" required
                                   th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{value}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="date" class="form-label">На дату</label>
                            <input class="form-control" type="date" th:field="*{date}" required th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{date}"></div>
                        </div>
                        <div class="col-md-8">
                            <label for="description" class="form-label">Примітка</label>
                            <input class="form-control" type="text" maxlength="150" th:field="*{description}"
                                   th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Внести</button>
                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
