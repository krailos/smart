<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Платежі')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('payments')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Платежі</h1>
                <div class="page-subtitle">Оплати не редагуються — помилкову оплату сторнують</div>
            </div>
            <div class="page-actions">
                <a th:href="@{/payments/payment/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Прийняти оплату
                </a>
            </div>
        </div>

        <!-- результат сторнування (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">Дата</th>
                        <th scope="col">Учень</th>
                        <th scope="col" class="text-end">Сума</th>
                        <th scope="col">Примітка</th>
                        <th scope="col">Статус</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment : ${payments}" th:classappend="${payment.storned} ? 'row-storned'">
                        <td class="text-nowrap" th:text="${payment.date != null} ? ${#temporals.format(payment.date, 'dd.MM.yyyy')}"></td>
                        <td class="fw-medium" th:text="${payment.student.lastName + ' ' + payment.student.firstName}"></td>
                        <!-- сторно (мінусова сума) — червоним -->
                        <td class="text-end fw-semibold text-nowrap"
                            th:classappend="${payment.value < 0} ? 'text-danger' : 'text-success'"
                            th:text="${(payment.value > 0 ? '+' : '') + payment.value + ' грн'}"></td>
                        <td class="text-muted small" th:text="${payment.description}"></td>
                        <td>
                            <span th:if="${payment.storned}" class="badge text-bg-secondary">Сторновано</span>
                            <span th:if="${payment.stornoOfId != null}" class="badge text-bg-danger">Сторно</span>
                        </td>
                        <td class="col-actions">
                            <a th:href="@{/payments/{id} ( id=${payment.id})}" class="btn btn-light btn-icon" title="Переглянути">
                                <i class="bi bi-eye"></i>
                            </a>
                            <!-- звичайну оплату можна сторнувати один раз; сторно не сторнують -->
                            <form th:if="${payment.stornoOfId == null and !payment.storned}"
                                  th:action="@{/payments/{id}/storno( id=${payment.id})}" method="post"
                                  onsubmit="return confirm('Сторнувати цю оплату? Буде створено запис з мінусовою сумою, баланс учня зменшиться.');">
                                <button class="btn btn-light btn-icon text-warning" title="Сторнувати"><i class="bi bi-arrow-return-left"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="6" class="empty-state">
                            <i class="bi bi-cash-coin"></i>
                            Оплат ще немає
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
