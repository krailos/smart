<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>transactionStudent</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: #edeff1"
     data-bs-theme="light">
    <div class="container">
        <a class="navbar-brand" href="/">Smartum</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">

                <!--li class="nav-item"><a class="nav-link active" aria-current="page" href="/schedules">Розклад</a></li-->

            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row">
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Дата</th>
                <th scope="col">Дата уроку</th>
                <th scope="col">Курс</th>
                <th scope="col">ID оплати</th>
                <th scope="col">Дата оплати</th>
                <th scope="col">ID студента</th>
                <th scope="col">Прізвище</th>
                <th scope="col">Ім'я</th>
                <th scope="col">Present</th>
                <th scope="col">Payed</th>
                <th scope="col">Вартість</th>
                <th scope="col">Знижка</th>
                <th scope="col">ДТ</th>
                <th scope="col">КТ</th>
                <th scope="col">Баланс</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ts, index : ${transactionsStudents}">
                <td th:text="${index.count}"></td>
                <td th:text="${ts.transactionDate}"></td>
                <td th:text="${ts.lessonDate}"></td>
                <td th:text="${ts.subjectName}"></td>
                <td th:text="${ts.paymentId}"></td>
                <td th:text="${ts.paymentDate}"></td>
                <td th:text="${ts.studentId}"></td>
                <td th:text="${ts.studentLastName}"></td>
                <td th:text="${ts.studentFirstName}"></td>
                <td th:text="${ts.studentPresent}"></td>
                <td th:text="${ts.lessonPayed}"></td>
                <td th:text="${ts.subjectFulPrice}"></td>
                <td th:text="${ts.discountValue}"></td>
                <td th:text="${ts.credit}"></td>
                <td th:text="${ts.debit}"></td>
                <td th:text="${ts.balance}"></td>

            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
