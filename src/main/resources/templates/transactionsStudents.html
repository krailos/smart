<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Транзакції учнів')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('reports')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Транзакції учнів</h1>
                <div class="page-subtitle"><a th:href="@{/reports}">Звіти</a> / списання за уроки та зарахування оплат</div>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Учень</th>
                        <th scope="col">Операція</th>
                        <th scope="col">Дата</th>
                        <th scope="col">Присутній / платний</th>
                        <th scope="col" class="text-end">Ціна</th>
                        <th scope="col" class="text-end">Знижка</th>
                        <th scope="col" class="text-end">Сума</th>
                        <th scope="col" class="text-end">Баланс</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ts, index : ${transactionsStudents}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium" th:text="${ts.studentLastName + ' ' + ts.studentFirstName}"></td>
                        <!-- транзакція або від уроку, або від оплати -->
                        <td>
                            <span th:if="${ts.lessonId != null}"><i class="bi bi-journal-check text-muted"></i> урок · <span th:text="${ts.subjectName}"></span></span>
                            <span th:if="${ts.paymentId != null and !ts.openingBalance}"><i class="bi bi-cash-coin text-muted"></i> оплата №<span th:text="${ts.paymentId}"></span></span>
                            <span th:if="${ts.openingBalance}"><i class="bi bi-box-arrow-in-right text-muted"></i> початковий баланс (№<span th:text="${ts.paymentId}"></span>)</span>
                        </td>
                        <td class="text-nowrap"
                            th:text="${ts.lessonDate != null} ? ${#temporals.format(ts.lessonDate, 'dd.MM.yyyy')}
                                   : (${ts.paymentDate != null} ? ${#temporals.format(ts.paymentDate, 'dd.MM.yyyy')})"></td>
                        <td>
                            <th:block th:if="${ts.lessonId != null}">
                                <span class="badge" th:classappend="${ts.studentPresent} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${ts.studentPresent} ? 'присутній' : 'відсутній'"></span>
                                <span class="badge" th:classappend="${ts.lessonPayed} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${ts.lessonPayed} ? 'платний' : 'безкоштовний'"></span>
                            </th:block>
                        </td>
                        <td class="text-end text-nowrap" th:text="${ts.lessonId != null} ? ${#numbers.formatDecimal(ts.subjectFulPrice, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="text-end text-nowrap" th:text="${ts.discountSum != 0} ? ${#numbers.formatDecimal(ts.discountSum, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <!-- credit: для уроку — списання (баланс -= credit), для оплати — зарахування (баланс += credit);
                             показуємо, як операція змінила баланс: мінус — списали, плюс — зарахували (сторно — навпаки) -->
                        <td class="text-end text-nowrap fw-semibold"
                            th:with="effect=${ts.lessonId != null ? -ts.credit : ts.credit}"
                            th:classappend="${effect < 0} ? 'text-danger' : 'text-success'"
                            th:text="${(effect > 0 ? '+' : '') + #numbers.formatDecimal(effect, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="text-end text-nowrap fw-semibold" th:classappend="${ts.balance < 0} ? 'text-danger'"
                            th:text="${#numbers.formatDecimal(ts.balance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactionsStudents)}">
                        <td colspan="9" class="empty-state">Транзакцій немає</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
