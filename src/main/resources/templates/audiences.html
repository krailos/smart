<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Аудиторії')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('audiences')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Аудиторії
                    <span th:if="${archived}" class="badge text-bg-secondary align-middle fs-6 fw-semibold">Архів</span>
                </h1>
                <div class="page-subtitle" th:text="'Усього: ' + ${audiences.size()}"></div>
            </div>
            <div class="page-actions">
                <!-- перемикач: активні / архів -->
                <div class="btn-group" role="group">
                    <a th:href="@{/audiences}" class="btn"
                       th:classappend="${archived} ? 'btn-outline-secondary' : 'btn-secondary'">Активні</a>
                    <a th:href="@{/audiences(archived=true)}" class="btn"
                       th:classappend="${archived} ? 'btn-secondary' : 'btn-outline-secondary'"><i class="bi bi-archive"></i> Архів</a>
                </div>
                <a th:href="@{/audiences/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати аудиторію
                </a>
            </div>
        </div>

        <!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Аудиторія</th>
                        <th scope="col">Опис</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="audience, index : ${audiences}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium" th:text="${audience.name}"></td>
                        <td class="text-muted small" th:text="${audience.description}"></td>
                        <td class="col-actions">
                            <a th:href="@{/audiences/{id}(id=${audience.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- архівування замість видалення: проведені уроки аудиторію пам'ятають -->
                            <form th:unless="${archived}" th:action="@{/audiences/{id}/archive( id=${audience.id})}"
                                  method="post" onsubmit="return confirm('Перемістити аудиторію в архів?');">
                                <button class="btn btn-light btn-icon text-danger" title="В архів"><i class="bi bi-archive"></i></button>
                            </form>
                            <form th:if="${archived}" th:action="@{/audiences/{id}/restore( id=${audience.id})}" method="post">
                                <button class="btn btn-light btn-icon text-success" title="Відновити"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(audiences)}">
                        <td colspan="4" class="empty-state">
                            <i class="bi bi-door-open"></i>
                            <span th:text="${archived} ? 'В архіві немає аудиторій' : 'Ще немає жодної аудиторії'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
