<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>discounts</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous" />
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg" style="background-color: #edeff1"
		data-bs-theme="light">
		<div class="container">
			<a class="navbar-brand" href="/">Smartum</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item"><a th:href="@{/discounts/discount/new}">
							<button class="btn btn-success">Створити нову знижку</button>
					</a></li>

                      <li class="nav-item"><a class="nav-link active"
                        aria-current="page" href="/studentsDiscounts">Знижки та Студенти</a></li>
					<!-- перемикач: активні / архів -->
					<li class="nav-item ms-2"><a class="btn btn-outline-secondary"
						th:href="${archived} ? @{/discounts} : @{/discounts(archived=true)}"
						th:text="${archived} ? 'Активні знижки' : 'Архів'"></a></li>
				</ul>
			</div>
		</div>
	</nav>
	<div class="container my-4">
		<div th:if="${archived}" class="text-center text-uppercase fs-5 fw-bolder">ЗНИЖКИ — АРХІВ</div>
		<div class="row">
			<!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
			<div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
			<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
			<table class="table table-striped">
				<thead>
					<tr>
						<th scope="col">#</th>						
						<th scope="col">Вид знижки</th>
						<th scope="col">Величина знижки</th>
						<th scope="col">Дата</th>												
						<th scope="col">Редагувати</th>
						<th scope="col">Архів</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="discount, index : ${discounts}">
						<td th:text="${index.count}"></td>
						<td th:text="${discount.name}"></td>
						<td th:text="${discount.value}"></td>
						<td th:text="${discount.date}"></td>
						<td><a th:href="@{/discounts/{id} (id=${discount.id})}">
								<button class="btn btn-primary">Редагувати знижку</button>
						</a></td>
						<td>
							<!-- архівування: знижку більше не можна призначити, але вже призначені працюють -->
							<form th:unless="${archived}" th:action="@{/discounts/{id}/archive( id=${discount.id})}"
								method="post" onsubmit="return confirm('Перемістити знижку в архів? Нові учні не зможуть її отримати.');">
								<button class="btn btn-outline-danger">В архів</button>
							</form>
							<form th:if="${archived}" th:action="@{/discounts/{id}/restore( id=${discount.id})}" method="post">
								<button class="btn btn-outline-success">Відновити</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</body>
</html>
