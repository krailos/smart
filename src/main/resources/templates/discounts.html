<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Знижки')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('discounts')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Знижки
                    <span th:if="${archived}" class="badge text-bg-secondary align-middle fs-6 fw-semibold">Архів</span>
                </h1>
                <div class="page-subtitle">Види знижок, які можна призначити учням</div>
            </div>
            <div class="page-actions">
                <!-- перемикач: активні / архів -->
                <div class="btn-group" role="group">
                    <a th:href="@{/discounts}" class="btn"
                       th:classappend="${archived} ? 'btn-outline-secondary' : 'btn-secondary'">Активні</a>
                    <a th:href="@{/discounts(archived=true)}" class="btn"
                       th:classappend="${archived} ? 'btn-secondary' : 'btn-outline-secondary'"><i class="bi bi-archive"></i> Архів</a>
                </div>
                <a th:href="@{/student-discounts}" class="btn btn-light"><i class="bi bi-person-check"></i> Знижки учнів</a>
                <a th:href="@{/discounts/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати знижку
                </a>
            </div>
        </div>

        <!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Вид знижки</th>
                        <th scope="col">Знижка</th>
                        <th scope="col">Діє з</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="discount, index : ${discounts}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium" th:text="${discount.name}"></td>
                        <td>
                            <span class="badge rounded-pill text-bg-success fs-6" th:text="${discount.value} + ' %'"></span>
                        </td>
                        <td th:text="${discount.date != null} ? ${#temporals.format(discount.date, 'dd.MM.yyyy')}"></td>
                        <td class="col-actions">
                            <a th:href="@{/discounts/{id} (id=${discount.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- архівування: знижку більше не можна призначити, але вже призначені працюють -->
                            <form th:unless="${archived}" th:action="@{/discounts/{id}/archive( id=${discount.id})}"
                                  method="post" onsubmit="return confirm('Перемістити знижку в архів? Нові учні не зможуть її отримати.');">
                                <button class="btn btn-light btn-icon text-danger" title="В архів"><i class="bi bi-archive"></i></button>
                            </form>
                            <form th:if="${archived}" th:action="@{/discounts/{id}/restore( id=${discount.id})}" method="post">
                                <button class="btn btn-light btn-icon text-success" title="Відновити"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(discounts)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-percent"></i>
                            <span th:text="${archived} ? 'В архіві немає знижок' : 'Ще немає жодної знижки'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
