<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова оплата')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('payments')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Прийняти оплату</h1>
                <div class="page-subtitle"><a th:href="@{/payments}">Платежі</a> / нова оплата</div>
            </div>
        </div>

        <!-- Помилка: сума не більша за нуль тощо -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}"></span>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <!-- th:object — форма прив'язана до ${payment} (PaymentDto з контролера);
                     th:field="*{поле}" сам ставить id, name і value — після помилки там те, що вже ввели;
                     th:errorclass — додає червону рамку (is-invalid), якщо поле не пройшло перевірку @Valid;
                     th:errors — текст помилки з анотації DTO (message = "...") під полем -->
                <form th:action="@{/payments/create}" th:object="${payment}" method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="studentId" class="form-label">Учень</label>
                            <!-- value="" + required: без вибраного учня браузер форму не відправить
                                 (а якщо надіслали в обхід браузера — спрацює @NotNull у PaymentDto) -->
                            <select th:field="*{studentId}" class="form-select" th:errorclass="is-invalid" required data-search>
                                <option value="">-- Оберіть учня --</option>
                                <option th:each="student : ${students}"
                                        th:text="|${student.lastName} ${student.firstName} (${student.contactName} - ${student.phone})|"
                                        th:value="${student.id}">name</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{studentId}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="date" class="form-label">Дата</label>
                            <input class="form-control" type="date" th:field="*{date}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{date}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="value" class="form-label">Сума, грн</label>
                            <input class="form-control" type="number" min="0.01" step="0.01" th:field="*{value}" required
                                   th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{value}"></div>
                        </div>
                        <div class="col-md-8">
                            <label for="description" class="form-label">Примітка</label>
                            <input class="form-control" type="text" maxlength="150" th:field="*{description}"
                                   th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Прийняти оплату</button>
                            <a th:href="@{/payments}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
