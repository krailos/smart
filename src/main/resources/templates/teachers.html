<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вчителі')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('teachers')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Вчителі
                    <span th:if="${archived}" class="badge text-bg-secondary align-middle fs-6 fw-semibold">Архів</span>
                </h1>
                <div class="page-subtitle" th:text="${archived} ? 'Вчителі, переміщені в архів' : 'Активні вчителі школи'"></div>
            </div>
            <div class="page-actions">
                <!-- перемикач: активні / архів -->
                <div class="btn-group" role="group">
                    <a th:href="@{/teachers}" class="btn"
                       th:classappend="${archived} ? 'btn-outline-secondary' : 'btn-secondary'">Активні</a>
                    <a th:href="@{/teachers(archived=true)}" class="btn"
                       th:classappend="${archived} ? 'btn-secondary' : 'btn-outline-secondary'"><i class="bi bi-archive"></i> Архів</a>
                </div>
                <a th:href="@{/teachers/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати вчителя
                </a>
            </div>
        </div>

        <!-- результат архівування / відновлення (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">ПІБ</th>
                        <th scope="col">Телефон</th>
                        <th scope="col">Групи</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="teacher, index : ${teachers}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium"
                            th:text="${teacher.lastName + ' ' + teacher.firstName + (teacher.secondName != null ? ' ' + teacher.secondName : '')}"></td>
                        <td th:text="${teacher.phone}"></td>
                        <td>
                            <a th:href="@{/teachers/{id}/gangs(id=${teacher.id})}"
                               class="badge rounded-pill text-bg-light border text-decoration-none fw-semibold"
                               title="Групи вчителя">
                                <i class="bi bi-people"></i> <span th:text="${teacher.getGangs().size()}"></span>
                            </a>
                        </td>
                        <td class="col-actions">
                            <a th:href="@{/teachers/{id} (id=${teacher.id}) }" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- архівування замість видалення: в історії (уроки, розклад) вчитель лишається -->
                            <form th:unless="${archived}" th:action="@{/teachers/{id}/archive( id=${teacher.id})}"
                                  method="post" onsubmit="return confirm('Перемістити вчителя в архів?');">
                                <button class="btn btn-light btn-icon text-danger" title="В архів"><i class="bi bi-archive"></i></button>
                            </form>
                            <form th:if="${archived}" th:action="@{/teachers/{id}/restore( id=${teacher.id})}" method="post">
                                <button class="btn btn-light btn-icon text-success" title="Відновити"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(teachers)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-person-badge"></i>
                            <span th:text="${archived} ? 'В архіві немає вчителів' : 'Ще немає жодного вчителя'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
