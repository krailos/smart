<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Проведення уроку')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('lessons')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Проведення уроку</h1>
                <div class="page-subtitle">
                    <a th:href="@{/schedules}">Розклад</a> /
                    <span th:text="${lesson.subjectName}"></span> · група <span th:text="${lesson.gangName}"></span>
                </div>
            </div>
        </div>

        <!-- Помилка: урок за цим розкладом на цю дату вже проведено, не вказана дата, кінець раніше за початок -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle"></i><span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/lessons/create}" method="post" th:object="${lesson}">
            <!-- з якого слоту розкладу проводиться урок (захист від повторного проведення) -->
            <input type="hidden" th:field="*{scheduleId}"/>

            <div class="card form-card mb-3">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <!-- курс, група, аудиторія — з розкладу, не змінюються (id передаємо прихованими полями) -->
                        <div class="col-md-4">
                            <label for="subject" class="form-label">Курс</label>
                            <input disabled class="form-control bg-light" id="subject" type="text" th:field="*{subjectName}"/>
                            <input type="hidden" th:field="*{subjectId}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="gang" class="form-label">Група</label>
                            <input disabled class="form-control bg-light" id="gang" type="text" th:field="*{gangName}"/>
                            <input type="hidden" th:field="*{gangId}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="aud" class="form-label">Аудиторія</label>
                            <input disabled class="form-control bg-light" id="aud" type="text" th:field="*{audienceName}"/>
                            <input type="hidden" th:field="*{audienceId}"/>
                        </div>

                        <!-- Хто фактично проводить урок: за замовчуванням вчитель з розкладу, можна вибрати заміну -->
                        <div class="col-md-4">
                            <label for="teacher" class="form-label">Вчитель</label>
                            <select id="teacher" class="form-select" th:field="*{teacherId}">
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.lastName + ' ' + teacher.firstName}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="date" class="form-label">Дата</label>
                            <input class="form-control" id="date" type="date" name="date"
                                   th:value="${lesson.date != null} ? ${lesson.date} : ${#dates.format(#dates.createToday(), 'yyyy-MM-dd')}"/>
                        </div>
                        <div class="col-md-2">
                            <label for="start" class="form-label">Початок</label>
                            <input class="form-control" id="start" type="time" name="startTime" th:value="${lesson.startTime}"/>
                        </div>
                        <div class="col-md-2">
                            <label for="end" class="form-label">Кінець</label>
                            <input class="form-control" id="end" type="time" name="endTime" th:value="${lesson.endTime}"/>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card form-card mb-3">
                <div class="card-header bg-transparent py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <span class="fw-semibold">Учні групи: відмітьте присутніх</span>
                    <!-- кнопки-перемикачі: вмикають усі (або вимикають, якщо всі вже ввімкнені) -->
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-light btn-sm" data-check-all="js-present">
                            <i class="bi bi-check2-all"></i> Усі присутні
                        </button>
                        <button type="button" class="btn btn-light btn-sm" data-check-all="js-payed">
                            <i class="bi bi-cash"></i> Усім платний
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover table-app">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Учень</th>
                            <th scope="col" class="text-center">Присутній</th>
                            <th scope="col" class="text-center">Платний урок</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ls, index : *{lessonsStudentsDto}">
                            <td class="text-muted" th:text="${index.count}"></td>
                            <td class="fw-medium">
                                <!-- id учня йде у форму прихованим полем, ім'я — просто текст -->
                                <input type="hidden" th:field="*{lessonsStudentsDto[__${index.index}__].studentId}"/>
                                <span th:text="${ls.studentLastName + ' ' + ls.studentFirstName}"></span>
                            </td>
                            <td class="text-center">
                                <div class="form-check form-switch d-inline-block">
                                    <input class="form-check-input js-present" type="checkbox" role="switch" value="true"
                                           th:field="*{lessonsStudentsDto[__${index.index}__].present}">
                                </div>
                            </td>
                            <td class="text-center">
                                <div class="form-check form-switch d-inline-block">
                                    <input class="form-check-input js-payed" type="checkbox" role="switch" value="true"
                                           th:field="*{lessonsStudentsDto[__${index.index}__].payed}">
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(lesson.lessonsStudentsDto)}">
                            <td colspan="4" class="empty-state">
                                <i class="bi bi-person-video2"></i>
                                У групі немає учнів
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Провести урок</button>
                <a th:href="@{/schedules}" class="btn btn-light">Скасувати</a>
            </div>
        </form>
    </main>
</div>

<script>
    // «Усі присутні» / «Усім платний»: якщо хоч один вимкнений — вмикаємо всі, інакше вимикаємо всі
    document.querySelectorAll('[data-check-all]').forEach(function (button) {
        button.addEventListener('click', function () {
            var boxes = document.querySelectorAll('input.' + button.dataset.checkAll);
            var allChecked = Array.prototype.every.call(boxes, function (box) { return box.checked; });
            boxes.forEach(function (box) { box.checked = !allChecked; });
        });
    });
</script>
</body>
</html>
