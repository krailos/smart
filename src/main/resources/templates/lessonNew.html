<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>lesson-new</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"/>
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: #edeff1" data-bs-theme="light">
    <div class="container">
        <a class="navbar-brand" href="/">Smartum</a>
        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/schedules">Розклад</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div>
        <div class="text-center fs-6 text-uppercase fw-semibold"></div>

        <form th:action="@{/lessons/create}" method="post" th:object="${lesson}">
            <div class="mb-3">

                <!-- Помилка: урок за цим розкладом на цю дату вже проведено, не вказана дата, кінець раніше за початок -->
                <div th:if="${errorMessage}" class="alert alert-danger mt-3" role="alert"
                     th:text="${errorMessage}"></div>

                <!-- з якого слоту розкладу проводиться урок (захист від повторного проведення) -->
                <input type="hidden" th:field="*{scheduleId}"/>

                <label for="aud" class="form-label"> Аудиторія
                    <input disabled class="form-control" id="aud" type="text" th:field="*{audienceName}"/>
                    <input id="audId" type="hidden" class="form-control" th:field="*{audienceId}"/>
                </label>
                <label for="subject" class="form-label"> Курс
                    <input disabled class="form-control" id="subject" type="text" th:field="*{subjectName}"/>
                    <input type="hidden" class="form-control" name="subjectId" th:field="*{subjectId}"/>
                </label>
                <label for="gang" class="form-label"> Група
                    <input disabled class="form-control" id="gang" type="text" th:field="*{gangName}"/>
                    <input type="hidden" class="form-control" name="gangId" th:field="*{gangId}"/>
                </label>
                <!-- Хто фактично проводить урок: за замовчуванням вчитель з розкладу, можна вибрати заміну -->
                <label for="teacher" class="form-label"> Вчитель
                    <select id="teacher" class="form-select" th:field="*{teacherId}">
                        <option th:each="teacher : ${teachers}"
                                th:value="${teacher.id}"
                                th:text="${teacher.lastName + ' ' + teacher.firstName}"></option>
                    </select>
                </label>
                <label for="date" class="form-label">Дата
                    <input class="form-control" id="date" type="date" name="date"
                           th:value="${lesson.date != null} ? ${lesson.date} : ${#dates.format(#dates.createToday(), 'yyyy-MM-dd')}"/>
                </label>
                <label for="start" class="form-label">
                    Початок уроку
                    <input class="form-control" id="start" type="time" name="startTime" th:value="${lesson.startTime}"/>
                </label>
                <label for="end" class="form-label">
                    Кінець уроку
                    <input class="form-control" id="end" type="time" name="endTime" th:value="${lesson.endTime}"/>
                </label>

                <div class="text-center fs-5 text-uppercase fw-light font-monospace">
                    виберіть присутніх учнів
                </div>

                <div>
                    <table class="table table-light">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Прізвище</th>
                            <th scope="col">Імя</th>
                            <th scope="col">Присутні на уроці</th>
                            <th scope="col">Платний урок</th>
                        </tr>
                        </thead>
                        <tbody class="table-group-divider">
                        <tr th:each="ls, index : *{lessonsStudentsDto}" th:field="*{lessonsStudentsDto}">
                            <td th:text="${index.count}"></td>
                            <td>
                                <input class="form-control" type="hidden"
                                       th:value="${ls.studentId}"
                                       th:field="*{lessonsStudentsDto[__${index.index}__].studentId}"
                                       th:text="${ls.studentLastName}">
                            </td>
                            <td th:text="${ls.studentFirstName}"></td>
                            <td>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role=switch
                                           value="true"
                                           th:field="*{lessonsStudentsDto[__${index.index}__].present}">
                                </div>
                            </td>

                            <td>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" role=switch
                                           value="true"
                                           th:field="*{lessonsStudentsDto[__${index.index}__].payed}">
                                </div>
                            </td>

                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>
            <button type="submit" class="btn btn-primary">Провести урок</button>
        </form>
    </div>
</div>
</body>
</html>
