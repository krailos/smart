<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Уроки та учні')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('reports')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Уроки та учні</h1>
                <div class="page-subtitle"><a th:href="@{/reports}">Звіти</a> / хто був на кожному уроці</div>
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">Урок №</th>
                        <th scope="col">Дата</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Учень</th>
                        <th scope="col">Присутній</th>
                        <th scope="col">Платний</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ls : ${lessonsStudents}">
                        <td class="text-muted" th:text="${ls.lessonId}"></td>
                        <td class="text-nowrap" th:text="${ls.lessonDate != null} ? ${#temporals.format(ls.lessonDate, 'dd.MM.yyyy')}"></td>
                        <td th:text="${ls.subjectName}"></td>
                        <td class="fw-medium" th:text="${ls.studentLastName + ' ' + ls.studentFirstName}"></td>
                        <td>
                            <span th:if="${ls.isPresent()}" class="badge text-bg-success">так</span>
                            <span th:unless="${ls.isPresent()}" class="badge text-bg-secondary">ні</span>
                        </td>
                        <td>
                            <span th:if="${ls.isPayed()}" class="badge text-bg-success">так</span>
                            <span th:unless="${ls.isPayed()}" class="badge text-bg-secondary">ні</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lessonsStudents)}">
                        <td colspan="6" class="empty-state">Даних немає</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
