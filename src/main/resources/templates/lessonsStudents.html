<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lessonStudent</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />
    <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: #edeff1"
     data-bs-theme="light">
    <div class="container">
        <a class="navbar-brand" href="/">Smartum</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">

                <!--li class="nav-item"><a class="nav-link active" aria-current="page" href="/schedules">Розклад</a></li-->

            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="row">
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">ID уроку</th>
                <th scope="col">Дата уроку</th>
                <th scope="col">Курс</th>
                <th scope="col">ID студента</th>
                <th scope="col">Прізвище</th>
                <th scope="col">Ім'я</th>
                <th scope="col">Присутній</th>
                <th scope="col">Оплачуваний</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ls, index : ${lessonsStudents}">
                <td th:text="${index.count}"></td>
                <td th:text="${ls.lessonId}"></td>
                <td th:text="${ls.lessonDate}"></td>
                <td th:text="${ls.subjectName}"></td>
                <td th:text="${ls.studentId}"></td>
                <td th:text="${ls.studentLastName}"></td>
                <td th:text="${ls.studentFirstName}"></td>
                <td th:text="${ls.isPresent()}"></td>
                <td th:text="${ls.isPayed()}"></td>

            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
