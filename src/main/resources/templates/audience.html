<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Аудиторія')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('audiences')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${audience.name}">Аудиторія</h1>
                <div class="page-subtitle"><a th:href="@{/audiences}">Аудиторії</a> / редагування</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/audiences/{id}/update( id=${audience.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Аудиторія</label>
                            <input class="form-control" id="name" type="text" name="name" th:value="${audience.name}"/>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      th:text="${audience.description}"></textarea>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/audiences}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
