<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Аудиторія')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('audiences')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${#strings.isEmpty(audience.name)} ? 'Аудиторія' : ${audience.name}">Аудиторія</h1>
                <div class="page-subtitle"><a th:href="@{/audiences}">Аудиторії</a> / редагування</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/audiences/{id}/update( id=${audience.id})}" th:object="${audience}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Аудиторія</label>
                            <input class="form-control" type="text" th:field="*{name}" th:errorclass="is-invalid" maxlength="50" required/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис</label>
                            <textarea class="form-control" th:field="*{description}" th:errorclass="is-invalid" maxlength="150" rows="3"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/audiences}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
