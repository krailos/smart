<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Група')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('gangs')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="${gang.name}">Група</h1>
                <div class="page-subtitle"><a th:href="@{/gangs}">Групи</a> / редагування</div>
            </div>
            <div class="page-actions">
                <a th:href="@{/gangs/{id}/bystudents(id=${gang.id})}" class="btn btn-light">
                    <i class="bi bi-person-video2"></i> Учні групи</a>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:object="${gang}" th:action="@{/gangs/{id}/update ( id=${gang.id}) }" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="name" class="form-label">Назва групи</label>
                            <input class="form-control" id="name" type="text" name="name" th:value="*{name}"/>
                        </div>
                        <div class="col-md-4">
                            <label for="subjectId" class="form-label">Курс</label>
                            <!-- порівнюємо за id: у GangDto є subjectId / teacherId -->
                            <select class="form-select" id="subjectId" name="subjectId">
                                <option value="">-- Оберіть курс --</option>
                                <option th:each="subject : ${subjects}"
                                        th:value="${subject.id}"
                                        th:text="${subject.name}"
                                        th:selected="${subject.id == gang.subjectId}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="teacherId" class="form-label">Вчитель</label>
                            <select class="form-select" id="teacherId" name="teacherId">
                                <option value="">-- Оберіть вчителя --</option>
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.lastName + ' ' + teacher.firstName}"
                                        th:selected="${teacher.id == gang.teacherId}">
                                </option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис групи</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      th:text="*{description}"></textarea>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/gangs}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
