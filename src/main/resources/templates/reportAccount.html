<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Звіт: виписка учня')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('reports')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="|${bill.student.lastName} ${bill.student.firstName}|">Учень</h1>
                <div class="page-subtitle">
                    <a th:href="@{/reports}">Звіти</a> / виписка ·
                    <span th:text="|${#temporals.format(bill.startDate, 'dd.MM.yyyy')} – ${#temporals.format(bill.endDate, 'dd.MM.yyyy')}|"></span>
                    · <span th:text="|${bill.student.contactName} ${bill.student.phone}|"></span>
                </div>
            </div>
            <div class="page-actions">
                <a th:href="@{/reports/statement/form(studentId=${bill.student.id}, dateStart=${bill.startDate}, dateEnd=${bill.endDate})}" class="btn btn-light"><i class="bi bi-arrow-repeat"></i> Інший період</a>
                <button type="button" class="btn btn-light" onclick="window.print()"><i class="bi bi-printer"></i> Друк</button>
            </div>
        </div>

        <!-- підсумки: баланс на початок + рух за період = баланс на кінець -->
        <div class="row g-3 mb-3">
            <div class="col-6 col-md-3">
                <div class="card"><div class="card-body">
                    <div class="text-muted small" th:text="|Баланс на ${#temporals.format(bill.startDate, 'dd.MM.yyyy')}|"></div>
                    <div class="fs-4 fw-bold" th:classappend="${bill.openingBalance < 0} ? 'text-danger'"
                         th:text="${#numbers.formatDecimal(bill.openingBalance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></div>
                </div></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card"><div class="card-body">
                    <div class="text-muted small">Нараховано за уроки</div>
                    <div class="fs-4 fw-bold"
                         th:text="${#numbers.formatDecimal(bill.totalCharged, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></div>
                </div></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card"><div class="card-body">
                    <div class="text-muted small">Сплачено</div>
                    <div class="fs-4 fw-bold text-success"
                         th:text="${#numbers.formatDecimal(bill.totalPaid, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></div>
                </div></div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card"><div class="card-body">
                    <div class="text-muted small" th:text="|Баланс на ${#temporals.format(bill.endDate, 'dd.MM.yyyy')}|"></div>
                    <div class="fs-4 fw-bold" th:classappend="${bill.closingBalance < 0} ? 'text-danger' : 'text-success'"
                         th:text="${#numbers.formatDecimal(bill.closingBalance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></div>
                </div></div>
            </div>
        </div>

        <!-- виписка: усі операції з журналу транзакцій за датою, баланс після кожної -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-app table-compact">
                    <!-- заголовки — по центру; дані в рядках: текст ліворуч, суми праворуч (копійки одна під одною) -->
                    <thead class="text-center">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Дата</th>
                        <th scope="col">Операція</th>
                        <th scope="col">Група</th>
                        <th scope="col">Статус</th>
                        <th scope="col">Ціна</th>
                        <th scope="col">Знижка</th>
                        <th scope="col">Списано</th>
                        <th scope="col">Сплачено</th>
                        <th scope="col">Баланс</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="text-muted">
                        <td></td>
                        <td class="text-nowrap" th:text="${#temporals.format(bill.startDate, 'dd.MM.yyyy')}"></td>
                        <td colspan="7">Баланс на початок періоду</td>
                        <td class="text-end text-nowrap fw-semibold" th:classappend="${bill.openingBalance < 0} ? 'text-danger'"
                            th:text="${#numbers.formatDecimal(bill.openingBalance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                    </tr>
                    <tr th:each="item, index : ${bill.items}" th:with="ts=${item.transaction}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(item.date, 'dd.MM.yyyy')}"></td>
                        <!-- операція: урок (курс) або оплата (примітка); сторно позначене тут -->
                        <td th:if="${!item.payment}" class="text-nowrap">
                            <i class="bi bi-journal-check text-muted"></i>
                            <span th:text="|Урок · ${ts.lesson.subject.name}|"></span>
                            <span th:if="${ts.credit < 0}" class="badge text-bg-danger">сторно</span>
                        </td>
                        <td th:if="${item.payment}">
                            <span class="text-nowrap">
                                <i class="bi bi-cash-coin text-muted"></i> Оплата
                                <span th:if="${ts.payment.stornoOf != null}" class="badge text-bg-danger">сторно</span>
                            </span>
                            <span class="d-block text-muted small" th:text="${ts.payment.description}"></span>
                        </td>
                        <!-- група і статус — тільки для уроку; в оплати клітинки порожні -->
                        <td class="text-nowrap" th:text="${!item.payment and ts.lesson.gang != null} ? ${ts.lesson.gang.name}"></td>
                        <td class="text-nowrap">
                            <th:block th:if="${!item.payment}">
                                <span class="badge" th:classappend="${ts.studentPresent} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${ts.studentPresent} ? 'присутній' : 'відсутній'"></span>
                                <span class="badge" th:classappend="${ts.lessonPayed} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${ts.lessonPayed} ? 'платний' : 'безкоштовний'"></span>
                            </th:block>
                        </td>
                        <!-- ціна і знижка — ті, що записали при проведенні уроку; тільки якщо було списання -->
                        <td class="text-end text-nowrap"
                            th:text="${!item.payment and ts.credit != 0} ? ${#numbers.formatDecimal(ts.subjectFulPrice, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="text-nowrap"
                            th:text="${!item.payment and ts.credit != 0 and ts.discountPercentage > 0}
                                     ? |${ts.discountPercentage} % · ${#numbers.formatDecimal(ts.discountSum, 1, 'WHITESPACE', 2, 'POINT')}|"></td>
                        <td class="text-end text-nowrap"
                            th:text="${!item.payment} ? ${#numbers.formatDecimal(ts.credit, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="text-end text-nowrap" th:classappend="${item.amount < 0} ? 'text-danger' : 'text-success'"
                            th:text="${item.payment} ? ${#numbers.formatDecimal(ts.credit, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="text-end text-nowrap fw-semibold" th:classappend="${item.balance < 0} ? 'text-danger'"
                            th:text="${#numbers.formatDecimal(item.balance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bill.items)}">
                        <td colspan="10" class="empty-state">За цей період операцій немає</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold">
                        <td colspan="7" class="text-end">Разом за період</td>
                        <td class="text-end text-nowrap"
                            th:text="${#numbers.formatDecimal(bill.totalCharged, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td class="text-end text-nowrap text-success"
                            th:text="${#numbers.formatDecimal(bill.totalPaid, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                        <td></td>
                    </tr>
                    <tr class="fw-bold">
                        <td></td>
                        <td class="text-nowrap" th:text="${#temporals.format(bill.endDate, 'dd.MM.yyyy')}"></td>
                        <td colspan="7">Баланс на кінець періоду</td>
                        <td class="text-end text-nowrap" th:classappend="${bill.closingBalance < 0} ? 'text-danger' : 'text-success'"
                            th:text="${#numbers.formatDecimal(bill.closingBalance, 1, 'WHITESPACE', 2, 'POINT')} + ' грн'"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
