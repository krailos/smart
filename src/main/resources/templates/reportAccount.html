<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Звіт: нарахування та платежі')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('reports')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title" th:text="|${bill.student.lastName} ${bill.student.firstName}|">Учень</h1>
                <div class="page-subtitle">
                    <a th:href="@{/reports}">Звіти</a> / нарахування та платежі ·
                    <span th:text="|${#temporals.format(bill.startDate, 'dd.MM.yyyy')} – ${#temporals.format(bill.endDate, 'dd.MM.yyyy')}|"></span>
                    · <span th:text="|${bill.student.contactName} ${bill.student.phone}|"></span>
                </div>
            </div>
            <div class="page-actions">
                <a th:href="@{/reports/account/form}" class="btn btn-light"><i class="bi bi-arrow-repeat"></i> Інший період</a>
                <button type="button" class="btn btn-light" onclick="window.print()"><i class="bi bi-printer"></i> Друк</button>
            </div>
        </div>

        <!-- підсумки: усе за вибраний період -->
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <div class="card"><div class="card-body">
                    <div class="text-muted small">Нараховано за уроки</div>
                    <div class="fs-4 fw-bold" th:text="${bill.totalItemSum} + ' грн'"></div>
                </div></div>
            </div>
            <div class="col-md-4">
                <div class="card"><div class="card-body">
                    <div class="text-muted small">Сплачено</div>
                    <div class="fs-4 fw-bold text-success" th:text="${bill.totalPaymentSum} + ' грн'"></div>
                </div></div>
            </div>
            <div class="col-md-4">
                <div class="card"><div class="card-body">
                    <div class="text-muted small">Баланс за період</div>
                    <div class="fs-4 fw-bold" th:classappend="${bill.balance < 0} ? 'text-danger' : 'text-success'"
                         th:text="${bill.balance} + ' грн'"></div>
                </div></div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header bg-transparent py-3 fw-semibold">Уроки</div>
            <div class="table-responsive">
                <table class="table table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Дата</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Група</th>
                        <th scope="col">Присутній</th>
                        <th scope="col">Платний</th>
                        <th scope="col" class="text-end">Ціна</th>
                        <th scope="col">Знижка</th>
                        <th scope="col" class="text-end">До сплати</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, index : ${items}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(item.date, 'dd.MM.yyyy')}"></td>
                        <td th:text="${item.subject.name}"></td>
                        <td th:text="${item.gang.name}"></td>
                        <td>
                            <span th:if="${item.lessonStudent.present}" class="badge text-bg-success">так</span>
                            <span th:unless="${item.lessonStudent.present}" class="badge text-bg-secondary">ні</span>
                        </td>
                        <td>
                            <span th:if="${item.lessonStudent.payed}" class="badge text-bg-success">так</span>
                            <span th:unless="${item.lessonStudent.payed}" class="badge text-bg-secondary">ні</span>
                        </td>
                        <td class="text-end text-nowrap" th:text="${item.price != null} ? ${item.price.value} + ' грн' : '—'"></td>
                        <!-- знижки може не бути (discount = null) -->
                        <td th:text="${item.discount != null} ? |${item.discount.name} (${item.discount.value} %)| : '—'"></td>
                        <td class="text-end fw-semibold text-nowrap" th:text="${item.itemSum} + ' грн'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="9" class="empty-state">За цей період уроків немає</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold">
                        <td colspan="8" class="text-end">Разом нараховано</td>
                        <td class="text-end text-nowrap" th:text="${bill.totalItemSum} + ' грн'"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-transparent py-3 fw-semibold">Платежі</div>
            <div class="table-responsive">
                <table class="table table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Дата</th>
                        <th scope="col">Примітка</th>
                        <th scope="col" class="text-end">Сума</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment, index : ${payments}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="text-nowrap" th:text="${#temporals.format(payment.date, 'dd.MM.yyyy')}"></td>
                        <td class="text-muted small" th:text="${payment.description}"></td>
                        <td class="text-end fw-semibold text-nowrap" th:classappend="${payment.value < 0} ? 'text-danger' : 'text-success'"
                            th:text="${payment.value} + ' грн'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="4" class="empty-state">За цей період платежів немає</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr class="fw-bold">
                        <td colspan="3" class="text-end">Разом сплачено</td>
                        <td class="text-end text-nowrap" th:text="${bill.totalPaymentSum} + ' грн'"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
