<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Уроки')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('lessons')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Уроки</h1>
                <div class="page-subtitle">Проведені уроки. Новий урок проводиться з розкладу</div>
            </div>
            <div class="page-actions">
                <a th:href="@{/schedules}" class="btn btn-primary"><i class="bi bi-play-fill"></i> Провести урок з розкладу</a>
            </div>
        </div>

        <!-- результат сторнування (flash-повідомлення після редиректу) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">Дата</th>
                        <th scope="col">Час</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Група</th>
                        <th scope="col">Вчитель</th>
                        <th scope="col">Аудиторія</th>
                        <th scope="col">Учні</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- сторнований урок — сірим, з позначкою -->
                    <tr th:each="lesson : ${lessons}" th:classappend="${lesson.storned} ? 'row-storned'">
                        <td class="fw-medium text-nowrap" th:text="${lesson.date != null} ? ${#temporals.format(lesson.date, 'dd.MM.yyyy')}"></td>
                        <td class="text-nowrap"
                            th:text="${#temporals.format(lesson.startTime, 'HH:mm') + '–' + #temporals.format(lesson.endTime, 'HH:mm')}"></td>
                        <td th:text="${lesson.subjectName}"></td>
                        <td th:text="${lesson.gangName}"></td>
                        <td th:text="${lesson.teacherName}"></td>
                        <td th:text="${lesson.audienceName}"></td>
                        <td>
                            <span class="badge rounded-pill text-bg-light border fw-semibold">
                                <i class="bi bi-person-video2"></i> <span th:text="${lesson.lessonsStudentsDto.size()}"></span>
                            </span>
                        </td>
                        <td class="col-actions">
                            <span th:if="${lesson.storned}" class="badge text-bg-secondary">Сторновано</span>
                            <!-- виправити / сторнувати — тільки адмін; вчитель свої уроки лише переглядає -->
                            <th:block sec:authorize="hasAuthority('ADMIN')">
                            <a th:unless="${lesson.storned}" th:href="@{/lessons/{id}(id=${lesson.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- помилка у формі уроку: сторнуємо (гроші повертаються) і проводимо заново з розкладу -->
                            <form th:unless="${lesson.storned}"
                                  th:action="@{/lessons/{id}/storno( id=${lesson.id})}" method="post"
                                  onsubmit="return confirm('Сторнувати урок? Усі списання за цей урок повернуться учням, урок можна буде провести заново.');">
                                <button class="btn btn-light btn-icon text-warning" title="Сторнувати"><i class="bi bi-arrow-return-left"></i></button>
                            </form>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lessons)}">
                        <td colspan="8" class="empty-state">
                            <i class="bi bi-journal-check"></i>
                            Ще не проведено жодного уроку
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
