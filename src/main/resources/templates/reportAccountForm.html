<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Звіт: нарахування та платежі')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('reports')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Нарахування та платежі</h1>
                <div class="page-subtitle"><a th:href="@{/reports}">Звіти</a> / параметри звіту</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/reports/account}" method="get">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="studentId" class="form-label">Учень</label>
                            <!-- value="" + required: без учня й дат браузер форму не відправить (інакше — помилка 500) -->
                            <select id="studentId" name="studentId" class="form-select" required>
                                <option value="">-- Оберіть учня --</option>
                                <option th:each="student : ${students}"
                                        th:text="|${student.lastName} ${student.firstName} (${student.contactName} - ${student.phone})|"
                                        th:value="${student.id}">name</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="dateStart" class="form-label">З</label>
                            <input class="form-control" id="dateStart" type="date" name="dateStart" required/>
                        </div>
                        <div class="col-md-3">
                            <label for="dateEnd" class="form-label">По</label>
                            <input class="form-control" id="dateEnd" type="date" name="dateEnd" required/>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-receipt"></i> Сформувати звіт</button>
                            <a th:href="@{/reports}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
