<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Головна')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('home')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Вітаємо в Smartum</h1>
                <div class="page-subtitle">Перегінське · що робимо сьогодні?</div>
            </div>
        </div>

        <!-- напр. "Пароль змінено" після сторінки "Змінити мій пароль" -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <!-- швидкі дії: найчастіші щоденні задачі -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <a th:href="@{/schedules}" class="card quick-action h-100">
                    <div class="card-body p-4">
                        <div class="report-icon"><i class="bi bi-play-fill"></i></div>
                        <div class="fw-bold mt-3">Провести урок</div>
                        <div class="text-muted small">з розкладу на сьогодні</div>
                    </div>
                </a>
            </div>
            <div class="col-sm-6 col-xl-3">
                <a th:href="@{/payments/payment/new}" class="card quick-action h-100">
                    <div class="card-body p-4">
                        <div class="report-icon"><i class="bi bi-cash-coin"></i></div>
                        <div class="fw-bold mt-3">Прийняти оплату</div>
                        <div class="text-muted small">зарахувати на баланс учня</div>
                    </div>
                </a>
            </div>
            <div class="col-sm-6 col-xl-3">
                <a th:href="@{/students/student/new}" class="card quick-action h-100">
                    <div class="card-body p-4">
                        <div class="report-icon"><i class="bi bi-person-plus"></i></div>
                        <div class="fw-bold mt-3">Додати учня</div>
                        <div class="text-muted small">нова картка учня</div>
                    </div>
                </a>
            </div>
            <div class="col-sm-6 col-xl-3">
                <a th:href="@{/reports}" class="card quick-action h-100">
                    <div class="card-body p-4">
                        <div class="report-icon"><i class="bi bi-bar-chart-line"></i></div>
                        <div class="fw-bold mt-3">Звіти</div>
                        <div class="text-muted small">нарахування, платежі, транзакції</div>
                    </div>
                </a>
            </div>
        </div>

        <div class="card overflow-hidden">
            <img th:src="@{/smartum.jpg}" class="img-fluid w-100" alt="Smartum">
        </div>
    </main>
</div>
</body>
</html>
