<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Змінити мій пароль')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('account')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Змінити мій пароль</h1>
                <div class="page-subtitle">
                    Користувач <span class="fw-semibold" th:text="${#authentication.name}"></span>
                </div>
            </div>
        </div>

        <!-- прийшли примусово: пароль задав адмін -->
        <div th:if="${forced}" class="alert alert-warning d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-shield-lock"></i>
            <span>Ваш пароль тимчасовий — його задав адміністратор. Придумайте свій пароль, щоб продовжити роботу.</span>
        </div>
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <form th:action="@{/account/password}" method="post" class="card form-card" style="max-width: 32rem">
            <div class="card-body p-4">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Поточний пароль</label>
                    <input id="currentPassword" name="currentPassword" type="password" class="form-control" required
                           autocomplete="current-password" autofocus>
                    <div class="form-text" th:if="${forced}">Той, з яким ви щойно увійшли</div>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Новий пароль</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control" required
                           th:attr="minlength=${minPasswordLength}" autocomplete="new-password">
                    <div class="form-text" th:text="'Не коротший за ' + ${minPasswordLength} + ' символів'"></div>
                </div>
                <div class="mb-1">
                    <label for="repeatPassword" class="form-label">Новий пароль ще раз</label>
                    <input id="repeatPassword" name="repeatPassword" type="password" class="form-control" required
                           th:attr="minlength=${minPasswordLength}" autocomplete="new-password">
                </div>
            </div>
            <div class="card-footer bg-transparent d-flex gap-2 p-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Змінити пароль</button>
                <!-- примусово — скасувати нікуди, тільки вийти -->
                <a th:unless="${forced}" th:href="@{/}" class="btn btn-light">Скасувати</a>
            </div>
        </form>
    </main>
</div>

<script>
    // повтор не збігається — браузер покаже підказку ще до відправки (сервер теж перевіряє)
    const newPassword = document.getElementById('newPassword');
    const repeatPassword = document.getElementById('repeatPassword');
    function checkRepeat() {
        repeatPassword.setCustomValidity(repeatPassword.value && repeatPassword.value !== newPassword.value
            ? 'Паролі не збігаються' : '');
    }
    newPassword.addEventListener('input', checkRepeat);
    repeatPassword.addEventListener('input', checkRepeat);
</script>
</body>
</html>
