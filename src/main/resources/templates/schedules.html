<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Розклад')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('schedules')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Розклад</h1>
                <div class="page-subtitle">Тижневий розклад занять. Урок проводиться зі слоту розкладу</div>
            </div>
            <div class="page-actions">
                <div class="btn-group" role="group" aria-label="Вигляд розкладу">
                    <a th:href="@{/schedules}" class="btn btn-light active"><i class="bi bi-list-ul"></i> Список</a>
                    <a th:href="@{/schedules/week}" class="btn btn-light"><i class="bi bi-calendar-week"></i> Тиждень</a>
                </div>
                <a th:href="@{/lessons}" class="btn btn-light"><i class="bi bi-journal-check"></i> Проведені уроки</a>
                <a th:href="@{/schedules/schedule/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати в розклад
                </a>
            </div>
        </div>

        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">День</th>
                        <th scope="col">Час</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Група</th>
                        <th scope="col">Вчитель</th>
                        <th scope="col">Аудиторія</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="schedule : ${schedules}">
                        <td><span class="badge text-bg-light border fw-semibold" th:text="${schedule.weekDay}"></span></td>
                        <td class="text-nowrap fw-medium"
                            th:text="${#temporals.format(schedule.startTime, 'HH:mm') + '–' + #temporals.format(schedule.endTime, 'HH:mm')}"></td>
                        <td th:text="${schedule.subjectName}"></td>
                        <td th:text="${schedule.gangName}"></td>
                        <td th:text="${schedule.teacherName}"></td>
                        <td th:text="${schedule.audienceName}"></td>
                        <td class="col-actions">
                            <!-- відкриває форму проведення уроку з цього слоту (POST, бо форма заповнюється даними розкладу) -->
                            <form th:action="@{/schedules/{id}/lesson(id=${schedule.id})}" method="post">
                                <button class="btn btn-success btn-sm me-1"><i class="bi bi-play-fill"></i> Провести урок</button>
                            </form>
                            <a th:href="@{/schedules/{id}(id=${schedule.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- м'яке видалення (@SoftDelete): проведені уроки зі слоту лишаються -->
                            <form th:action="@{/schedules/{id}/delete( id=${schedule.id})}" method="post"
                                  onsubmit="return confirm('Видалити заняття з розкладу?');">
                                <button class="btn btn-light btn-icon text-danger" title="Видалити"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(schedules)}">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-calendar-week"></i>
                            Розклад порожній
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
