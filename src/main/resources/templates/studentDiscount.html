<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Знижка учня')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('discounts')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Редагування знижки учня</h1>
                <div class="page-subtitle">
                    <a th:href="@{/discounts}">Знижки</a> / <a th:href="@{/studentsDiscounts}">знижки учнів</a> / редагування
                </div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/studentsDiscounts/{id}/update(id = ${studentDiscount.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="studentId" class="form-label">Учень</label>
                            <!-- value="" у підказці: якщо нічого не вибрано, не відправляємо текст замість id -->
                            <select id="studentId" name="studentId" class="form-select">
                                <option value="">-- Оберіть учня --</option>
                                <option th:each="student : ${students}"
                                        th:text="|${student.lastName} ${student.firstName} (${student.contactName} - ${student.phone})|"
                                        th:value="${student.id}"
                                        th:selected="${studentDiscount.student.id == student.id}">name</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="subjectId" class="form-label">Курс</label>
                            <select id="subjectId" name="subjectId" class="form-select">
                                <option value="">-- Оберіть курс --</option>
                                <option th:each="subject : ${subjects}"
                                        th:text="${subject.name}"
                                        th:value="${subject.id}"
                                        th:selected="${studentDiscount.subject.id == subject.id}">name</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="discountId" class="form-label">Знижка</label>
                            <select id="discountId" name="discountId" class="form-select">
                                <option value="">-- Оберіть знижку --</option>
                                <option th:each="discount : ${discounts}"
                                        th:text="|${discount.name} — ${discount.value} %|"
                                        th:value="${discount.id}"
                                        th:selected="${studentDiscount.discount.id == discount.id}">name</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <!-- дата самого запису, а не сьогоднішня: інакше збереження непомітно змінювало дату -->
                            <label for="date" class="form-label">Дата</label>
                            <input class="form-control" id="date" type="date" name="date" th:value="${studentDiscount.date}"/>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/studentsDiscounts}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
