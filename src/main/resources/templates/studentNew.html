<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новий учень')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('students')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Новий учень</h1>
                <div class="page-subtitle"><a th:href="@{/students}">Учні</a> / новий</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:object="${student}" th:action="@{/students/create}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="lastName" class="form-label">Прізвище</label>
                            <input class="form-control" type="text" maxlength="50" required th:field="*{lastName}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="firstName" class="form-label">Ім'я</label>
                            <input class="form-control" type="text" maxlength="50" required th:field="*{firstName}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="secondName" class="form-label">По батькові</label>
                            <input class="form-control" type="text" maxlength="50" th:field="*{secondName}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{secondName}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="gender" class="form-label">Стать</label>
                            <select class="form-select" th:field="*{gender}" th:errorclass="is-invalid" required>
                                <option value="">-- Оберіть стать --</option>
                                <option th:each="g : ${gender}" th:value="${g}" th:text="${g}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{gender}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="studentStatus" class="form-label">Статус</label>
                            <select class="form-select" th:field="*{studentStatus}" th:errorclass="is-invalid" required>
                                <option value="">-- Оберіть статус --</option>
                                <option th:each="s : ${status}" th:value="${s}" th:text="${s}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{studentStatus}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="birthDate" class="form-label">Дата народження</label>
                            <input class="form-control" type="date" th:field="*{birthDate}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{birthDate}"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="contactName" class="form-label">Контактна особа</label>
                            <input class="form-control" type="text" maxlength="50" required th:field="*{contactName}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{contactName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="phone" class="form-label">Телефон</label>
                            <input class="form-control" type="text" maxlength="50" required th:field="*{phone}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">Email</label>
                            <input class="form-control" type="email" maxlength="50" th:field="*{email}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="col-12">
                            <label for="address" class="form-label">Адреса</label>
                            <input class="form-control" type="text" maxlength="150" th:field="*{address}" th:errorclass="is-invalid"/>
                            <div class="invalid-feedback" th:errors="*{address}"></div>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис</label>
                            <textarea class="form-control" maxlength="150" th:field="*{description}" th:errorclass="is-invalid" rows="3"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/students}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
