<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ціна')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('subjects')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Редагування ціни</h1>
                <div class="page-subtitle">
                    <a th:href="@{/subjects}">Курси</a> /
                    <a th:href="@{/subjects/{id}/prices(id=${price.subjectId})}" th:text="${price.subjectName}">курс</a> / ціна
                </div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <!-- курс береться з самої ціни (PriceDto.subjectId / subjectName) -->
                <form th:action="@{/prices/{id}/update( id=${price.id})}" method="post">
                    <input type="hidden" name="subjectId" th:value="${price.subjectId}"/>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="subjectName" class="form-label">Курс</label>
                            <input class="form-control bg-light" id="subjectName" type="text" th:value="${price.subjectName}" disabled/>
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label">Вид ціни</label>
                            <input class="form-control" id="name" type="text" name="name" th:value="${price.name}"/>
                        </div>
                        <div class="col-md-6">
                            <label for="value" class="form-label">Вартість уроку, грн</label>
                            <input class="form-control" id="value" type="number" min="0" step="0.01" name="value" th:value="${price.value}" required/>
                        </div>
                        <div class="col-md-6">
                            <label for="date" class="form-label">Діє з</label>
                            <input class="form-control" id="date" type="date" name="date" th:value="${price.date}"/>
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/subjects/{id}/prices(id=${price.subjectId})}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
