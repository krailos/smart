<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Курси')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('subjects')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">
                    Курси
                    <span th:if="${archived}" class="badge text-bg-secondary align-middle fs-6 fw-semibold">Архів</span>
                </h1>
                <div class="page-subtitle" th:text="'Усього: ' + ${subjects.size()}"></div>
            </div>
            <div class="page-actions">
                <!-- перемикач: активні / архів -->
                <div class="btn-group" role="group">
                    <a th:href="@{/subjects}" class="btn"
                       th:classappend="${archived} ? 'btn-outline-secondary' : 'btn-secondary'">Активні</a>
                    <a th:href="@{/subjects(archived=true)}" class="btn"
                       th:classappend="${archived} ? 'btn-secondary' : 'btn-outline-secondary'"><i class="bi bi-archive"></i> Архів</a>
                </div>
                <a th:href="@{/prices}" class="btn btn-light"><i class="bi bi-tags"></i> Усі ціни</a>
                <a th:href="@{/subjects/subject/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Додати курс
                </a>
            </div>
        </div>

        <!-- результат архівування / відновлення, помилка "ціна на цю дату вже є" (flash-повідомлення) -->
        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover table-app">
                    <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Курс</th>
                        <th scope="col">Вартість уроку</th>
                        <th scope="col">Опис</th>
                        <th scope="col" class="col-actions">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="subject, index : ${subjects}">
                        <td class="text-muted" th:text="${index.count}"></td>
                        <td class="fw-medium" th:text="${subject.name}"></td>
                        <!-- ціни відсортовані від найновішої (SubjectService), тому [0] — поточна -->
                        <td>
                            <span th:if="${subject.pricesDto.size() > 0}" class="badge rounded-pill text-bg-light border fw-semibold fs-6"
                                  th:text="${subject.pricesDto[0].value} + ' грн'"></span>
                            <span th:unless="${subject.pricesDto.size() > 0}" class="text-muted">—</span>
                        </td>
                        <td class="text-muted small" th:text="${subject.description}"></td>
                        <td class="col-actions">
                            <a th:href="@{/prices/{subjectId}/bysubject(subjectId=${subject.id})}" class="btn btn-light btn-icon" title="Ціни курсу">
                                <i class="bi bi-tags"></i>
                            </a>
                            <a th:href="@{/subjects/{id}(id=${subject.id})}" class="btn btn-light btn-icon" title="Редагувати">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- архівування замість видалення: уроки, ціни й оплати в історії лишаються -->
                            <form th:unless="${archived}" th:action="@{/subjects/{id}/archive( id=${subject.id})}"
                                  method="post" onsubmit="return confirm('Перемістити курс в архів?');">
                                <button class="btn btn-light btn-icon text-danger" title="В архів"><i class="bi bi-archive"></i></button>
                            </form>
                            <form th:if="${archived}" th:action="@{/subjects/{id}/restore( id=${subject.id})}" method="post">
                                <button class="btn btn-light btn-icon text-success" title="Відновити"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(subjects)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-book"></i>
                            <span th:text="${archived} ? 'В архіві немає курсів' : 'Ще немає жодного курсу'"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
