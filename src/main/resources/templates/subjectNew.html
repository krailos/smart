<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новий курс')}"></head>
<body>
<div class="app">
    <th:block th:replace="~{fragments/layout :: sidebar('subjects')}"></th:block>

    <main class="app-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Новий курс</h1>
                <div class="page-subtitle"><a th:href="@{/subjects}">Курси</a> / новий</div>
            </div>
        </div>

        <div class="card form-card">
            <div class="card-body p-4">
                <form th:action="@{/subjects/create}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Назва курсу</label>
                            <input class="form-control" id="name" type="text" name="name" th:value="${subject.name}"/>
                        </div>
                        <div class="col-12">
                            <label for="description" class="form-label">Опис курсу</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      th:text="${subject.description}"></textarea>
                        </div>
                        <div class="col-12 text-muted small">
                            <i class="bi bi-info-circle"></i> Вартість уроку додається після створення курсу — кнопкою «Ціни курсу».
                        </div>

                        <div class="col-12 form-actions">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Зберегти</button>
                            <a th:href="@{/subjects}" class="btn btn-light">Скасувати</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
